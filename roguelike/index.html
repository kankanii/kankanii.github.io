<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="누더기 검사">
<meta name="application-name" content="누더기 검사">
<meta name="theme-color" content="#0d0e12">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="description" content="2.5D 스프라이트 스태킹 로그라이크 — 아이폰에서 바로 플레이하는 모바일 웹앱">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>누더기 검사 — 2.5D 스프라이트 스태킹 로그라이크</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0e12;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;color:#e9e3d6}
body{position:fixed;inset:0;width:100%;height:100%;-webkit-tap-highlight-color:transparent}
#game{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#topleft{position:absolute;left:18px;top:16px}
.hpwrap{position:relative;width:250px;height:20px;background:#241d19cc;border:2px solid #0a0806;border-radius:5px;
  box-shadow:0 2px 0 #0006, inset 0 0 12px #0009;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(#d9564a,#8e221b);transition:width .14s linear}
#hptext{position:absolute;inset:0;font-size:12px;font-weight:800;letter-spacing:.4px;
  display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000c}
.row{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;font-weight:800;color:#c9bfa8}
.xpwrap{width:150px;height:7px;background:#241d19cc;border:1px solid #0a0806;border-radius:4px;overflow:hidden}
#xpfill{height:100%;width:0%;background:linear-gradient(#7fd4ff,#3a86c9);transition:width .18s}
#topmid{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center}
#wavetext{font-size:22px;font-weight:900;letter-spacing:3px;color:#f2d68a;text-shadow:0 3px 0 #000a,0 0 18px #ffb84a55}
#waveSub{font-size:11px;color:#b9ae97;letter-spacing:1px;margin-top:2px}
#topright{position:absolute;right:18px;top:16px;text-align:right}
#killtext{font-size:13px;font-weight:800;color:#c9bfa8}
#hint{font-size:10px;color:#8d8677;margin-top:4px;letter-spacing:.3px}

#inspector{position:absolute;left:16px;bottom:16px;width:150px;padding:6px 6px 4px;
  background:#14110ee0;border:2px solid #3b3227;border-radius:8px;box-shadow:0 6px 20px #000a;transition:opacity .2s}
#inspector.off{opacity:0;pointer-events:none}
#insp{display:block;position:static;width:150px;height:190px;background:radial-gradient(ellipse at 50% 30%,#33302a,#16130f 70%);border-radius:5px}
.inslabel{font-size:10px;font-weight:800;color:#d9c48c;text-align:center;margin-top:3px;letter-spacing:.5px}
.inshint{font-size:9px;color:#7e7767;text-align:center;margin-top:1px}

#skills{position:absolute;right:18px;bottom:18px;display:flex;gap:9px;align-items:flex-end}
.skill{position:relative;width:62px;height:62px;border-radius:9px;background:#1b1713e8;border:2px solid #4a3f31;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 0 #0007}
.skill .key{font-size:15px;font-weight:900;color:#f0d79a;letter-spacing:.5px}
.skill .nm{font-size:9px;color:#a89d88;margin-top:1px}
.skill i.cd{position:absolute;left:0;right:0;bottom:0;height:0%;background:#000000b8;pointer-events:none}
.skill.ready{border-color:#c9a659}
.skill.on{box-shadow:0 0 16px #ffd47988,0 4px 0 #0007}

#controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;color:#9a927f;
  background:#0e0c0abb;padding:6px 14px;border-radius:20px;border:1px solid #241f19;white-space:nowrap}
#controls b{color:#e3cf94}

#banner{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#banner.show{opacity:1}
#bannerMain{font-size:44px;font-weight:900;color:#ffe9a8;letter-spacing:4px;text-shadow:0 4px 0 #000c,0 0 34px #ffb84a88}
#bannerSub{font-size:14px;color:#d8cdb4;margin-top:6px;letter-spacing:2px}

#cards{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:#07060ad4;z-index:20;backdrop-filter:blur(3px)}
#cards.show{display:flex}
.cardhead{font-size:15px;font-weight:900;letter-spacing:3px;color:#f2d68a}
.cardhead span{font-size:11px;color:#8d8677;letter-spacing:0;margin-left:8px}
#cardrow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:0 18px}
.card{width:212px;min-height:212px;background:linear-gradient(#221d18,#151210);border:2px solid #6b5734;border-radius:12px;
  padding:16px 14px;cursor:pointer;box-shadow:0 10px 26px #000a, inset 0 0 26px #0006;transition:transform .12s,border-color .12s;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.card:hover{transform:translateY(-6px);border-color:#e0bc6a;box-shadow:0 16px 30px #000c,0 0 22px #ffb84a44}
.card .num{font-size:11px;color:#8d8677;font-weight:800;align-self:flex-end}
.card .ico{font-size:38px;margin:6px 0 8px;line-height:1;filter:drop-shadow(0 3px 0 #0008)}
.card .ttl{font-size:16px;font-weight:900;color:#ffe2a2;letter-spacing:.5px}
.card .dsc{font-size:12px;color:#b6ab95;margin-top:8px;line-height:1.5}
.card .rar{font-size:10px;margin-top:auto;padding-top:8px;color:#7fd4ff;letter-spacing:1px}

#touchui{position:fixed;inset:0;z-index:8;pointer-events:none}
#touchui.off{display:none}
#joyBase{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;background:#ffffff10;border:2px solid #ffffff28;pointer-events:auto;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#joyKnob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:#ffffff44;border:2px solid #ffffff55;
  pointer-events:none;transition:transform .06s linear}
.tbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
  background:#c4473de6;border:2px solid #00000055;box-shadow:0 4px 0 #0006;pointer-events:auto;color:#fff;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.tbtn span{position:relative;z-index:1;pointer-events:none;line-height:1}
.tbtn i.cd{position:absolute;left:0;right:0;bottom:0;height:0%;background:#000000a8;pointer-events:none}
.tbtn.cool{filter:saturate(.5) brightness(.7)}
.tbtn.ready{border-color:#ffffff70}
.tbtn:active{transform:scale(.94)}
#tAttack{width:88px;height:88px;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#tDash{width:62px;height:62px;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  background:#3d7bc4e6;font-size:12px}
#tQ{width:56px;height:56px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px));
  background:#9a5fd8e6;font-size:12px}
#tE{width:56px;height:56px;right:calc(88px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px));
  background:#36b39be6;font-size:12px}

#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:#08070bdd;z-index:25}
#over.show{display:flex}
#overTitle{font-size:40px;font-weight:900;color:#ffe9a8;letter-spacing:6px;text-shadow:0 4px 0 #000c}
#overSub{font-size:14px;color:#b6ab95}
#restart{margin-top:10px;padding:12px 28px;font-size:15px;font-weight:800;border:2px solid #6b5734;border-radius:10px;
  background:#241d18;color:#f2d68a;cursor:pointer;font-family:inherit}

/* ===================== 모바일 / 터치 반응형 ===================== */
#cards{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#over{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.card{-webkit-tap-highlight-color:transparent}
/* 터치 모드: PC 키 안내·캐릭터 인스펙터·스킬 쿨타임 패널은 접어서 화면을 가리지 않게 */
body.touchmode #controls,body.touchmode #inspector,body.touchmode #skills,body.touchmode #hint{display:none}
body.touchmode #banner{top:15%}

@media (max-width:900px){
  #topleft{left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
  .hpwrap{width:138px;height:15px;border-radius:4px}
  #hptext{font-size:9.5px;letter-spacing:0}
  .row{font-size:9px;gap:5px;margin-top:4px}
  .xpwrap{width:56px;height:6px}
  #topmid{top:calc(6px + env(safe-area-inset-top,0px))}
  #wavetext{font-size:13px;letter-spacing:1.2px;text-shadow:0 2px 0 #000a}
  #waveSub{font-size:9px;letter-spacing:.4px;margin-top:1px}
  #topright{right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px))}
  #killtext{font-size:10px}
  #bannerMain{font-size:30px;letter-spacing:2px}
  #bannerSub{font-size:11px;letter-spacing:1px}
  #cards{gap:10px}
  #cardrow{gap:8px;padding:0 12px;width:100%}
  .cardhead{font-size:12px;letter-spacing:2px}
  .cardhead span{display:none}
  .card{width:100%;max-width:330px;min-height:0;padding:10px 12px;border-radius:10px}
  .card:hover{transform:none}
  .card:active{transform:scale(.97);border-color:#e0bc6a}
  .card .num{font-size:10px}
  .card .ico{font-size:26px;margin:2px 0 4px}
  .card .ttl{font-size:14px}
  .card .dsc{font-size:11.5px;margin-top:4px;line-height:1.4}
  .card .rar{font-size:9px;padding-top:5px}
  #overTitle{font-size:28px;letter-spacing:3px}
  #overSub{font-size:12px}
  #restart{padding:11px 24px;font-size:14px}
}

/* 가로·짧은 높이(852×393 등): 강화 카드 3장을 한 줄로 */
@media (orientation:landscape) and (max-height:520px){
  #cardrow{flex-wrap:nowrap;gap:8px}
  .card{width:auto;flex:1 1 0;max-width:220px;padding:8px}
  .card .ico{font-size:20px;margin:0 0 3px}
  .card .ttl{font-size:12.5px}
  .card .dsc{font-size:10px;line-height:1.32;margin-top:3px}
  .card .rar{font-size:8.5px;padding-top:4px}
}

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- ===== HUD ===== -->
<div id="hud">
  <div id="topleft">
    <div class="hpwrap"><div id="hpfill"></div><div id="hptext">100 / 100</div></div>
    <div class="row"><span id="lvl">Lv.1</span>
      <div class="xpwrap"><div id="xpfill"></div></div>
      <span id="xptext">0/10</span></div>
  </div>

  <div id="topmid">
    <div id="wavetext">WAVE 1 / 6</div>
    <div id="waveSub">적 0</div>
  </div>

  <div id="topright">
    <div id="killtext">처치 0</div>
    <div id="hint">V 줌 · I 인스펙터 · M 터치UI</div>
  </div>

  <!-- 캐릭터 인스펙터 -->
  <div id="inspector">
    <canvas id="insp" width="150" height="190"></canvas>
    <div class="inslabel">캐릭터 인스펙터</div>
    <div class="inshint">V: 확대 · I: 숨기기</div>
  </div>

  <!-- 스킬 -->
  <div id="skills">
    <div class="skill" id="skQ"><span class="key">Q</span><span class="nm">회전베기</span><i class="cd"></i></div>
    <div class="skill" id="skE"><span class="key">E</span><span class="nm">검기파동</span><i class="cd"></i></div>
    <div class="skill" id="skD"><span class="key">SPC</span><span class="nm">대시</span><i class="cd"></i></div>
  </div>

  <div id="controls">
    <b>WASD</b> 이동 · <b>좌클릭/J</b> 3연타 검 콤보 · <b>Space/Shift</b> 대시 · <b>Q</b> 회전베기 · <b>E</b> 검기파동 · <b>V</b> 확대
  </div>
</div>

<div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>

<!-- ===== 카드 선택 ===== -->
<div id="cards">
  <div class="cardhead">강화 카드 <span>1 / 2 / 3 키 또는 클릭</span></div>
  <div id="cardrow"></div>
</div>

<!-- ===== 모바일 ===== -->
<div id="touchui" class="off">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="tAttack" aria-label="일반공격"><span>검</span><i class="cd"></i></div>
  <div class="tbtn" id="tDash" aria-label="대시"><span>대시</span><i class="cd"></i></div>
  <div class="tbtn" id="tQ" aria-label="회전베기"><span>Q</span><i class="cd"></i></div>
  <div class="tbtn" id="tE" aria-label="검기파동"><span>E</span><i class="cd"></i></div>
</div>

<div id="over">
  <div id="overTitle">숲의 검사</div>
  <div id="overSub"></div>
  <button id="restart">다시 시작 (R)</button>
</div>

<script>
'use strict';
/* =========================================================================
   char.js — 스프라이트 스태킹(Sprite Stacking) 슬라이스 생성 + 스택 렌더러
   모든 슬라이스는 위에서 내려다본 단면(단면도)이며,
   화면에는 Z=0(발) 부터 Z=max(머리 끝)까지 sliceGap 만큼 수직 오프셋으로
   겹쳐 그려 2.5D 입체를 만든다.
   ========================================================================= */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); }
function interp(tbl, t) {
  if (t <= tbl[0][0]) return tbl[0][1];
  for (let i = 1; i < tbl.length; i++) {
    if (t <= tbl[i][0]) {
      const a = tbl[i - 1], b = tbl[i];
      return lerp(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
    }
  }
  return tbl[tbl.length - 1][1];
}

const SC = 96, HALF = SC / 2;
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mkSlice(fn, size) {
  const s = size || SC;
  const c = newCanvas(s, s);
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  g.imageSmoothingEnabled = false;
  fn(g, s);
  return c;
}

/* 카메라(투영) ---------------------------------------------------------- */
const CAM = { x: 0, z: 0, zoom: 1.30, yScale: 0.62, shakeX: 0, shakeY: 0 };
let VW = 1280, VH = 720;
function scrX(wx) { return (wx - CAM.x) * CAM.zoom + VW / 2 + CAM.shakeX; }
function scrY(wy, wz) { return (wz - CAM.z) * CAM.yScale * CAM.zoom + VH / 2 - wy * CAM.zoom + CAM.shakeY; }

/* 팔레트 ---------------------------------------------------------------- */
const C = {
  skin: '#d7a271', skinHi: '#eec396', skinLo: '#9d6f45', skinShade: '#b8814f',
  hair: '#2b211a', hairHi: '#4b3a2b', hairLo: '#150f0c',
  tunic: '#6a5744', tunicHi: '#8a7359', tunicLo: '#3d3026', tunicDark: '#4b3d31',
  patch: '#8f7857', patch2: '#75664f', stitch: '#5c4a37',
  pants: '#4b4237', pantsLo: '#2c2721',
  bandage: '#c4ab81', bandageLo: '#8f7a56',
  boot: '#3b2c21', bootLo: '#201711',
  rope: '#ab8b5c', ropeLo: '#71582f',
  blade: '#c8d2db', bladeHi: '#ffffff', bladeLo: '#77828e',
  hilt: '#5f4227', guard: '#b3a068',
  eye: '#140f0c', lip: '#8a4638',
  slime: '#5fb04a', slimeHi: '#93e07a', slimeLo: '#2c6b28', slimeDark: '#1e4a1c',
  gob: '#7d9150', gobHi: '#a8bb72', gobLo: '#4a5a2c', gobLeather: '#5a4430',
  magRobe: '#4a3a6b', magRobeHi: '#6f5b96', magRobeLo: '#291f3d', magGlow: '#8fd4ff',
  stone: '#7b7d84', stoneHi: '#a2a4ab', stoneLo: '#4c4e55',
  wood: '#8a6239', woodHi: '#b0824f', woodLo: '#4f341c', iron: '#3d3f47', ironHi: '#6d707b',
  fire: '#ff9a3c',
};

/* 색 유틸 -------------------------------------------------------------- */
const _cc = new Map();
function hex2rgb(h) {
  if (_cc.has(h)) return _cc.get(h);
  let v = h.replace('#', '');
  if (v.length === 3) v = v[0] + v[0] + v[1] + v[1] + v[2] + v[2];
  const n = parseInt(v, 16);
  const o = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _cc.set(h, o); return o;
}
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${(A[0] + (B[0] - A[0]) * t) | 0},${(A[1] + (B[1] - A[1]) * t) | 0},${(A[2] + (B[2] - A[2]) * t) | 0})`;
}
const lite = (c, t) => mixc(c, '#fff6e6', t);
const dark = (c, t) => mixc(c, '#120d0a', t);

/* 그리기 기본 도형 ------------------------------------------------------
   단면(슬라이스)은 위에서 본 원판이므로, 가장자리로 갈수록 살짝 어두운
   방사형 음영을 넣어 수직으로 쌓였을 때 "겹친 띠"가 아니라 "덩어리"로
   읽히게 한다. */
function disc(g, cx, cy, rx, ry, base, hi, lo, rot) {
  if (rx <= 0 || ry <= 0) return;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); g.fillStyle = base; g.fill();
  if (lo) { g.save(); g.globalAlpha = 0.10; g.strokeStyle = lo; g.lineWidth = 0.9; g.stroke(); g.restore(); }
}

function ragged(g, cx, cy, rx, ry, base, lo, seed, wob, n) {
  if (rx <= 0 || ry <= 0) return;
  wob = wob === undefined ? 0.08 : wob; n = n || 26;
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    const r = 1 + (hash(seed * 13.7 + i * 3.13) - 0.5) * 2 * wob;
    const px = cx + Math.cos(a) * rx * r, py = cy + Math.sin(a) * ry * r;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath(); g.fillStyle = base; g.fill();
  if (lo) { g.save(); g.globalAlpha = 0.12; g.strokeStyle = lo; g.lineWidth = 0.9; g.stroke(); g.restore(); }
}

function spiky(g, cx, cy, r, seed, pts) {
  if (r <= 0) return;
  pts = pts || 9;
  g.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i / (pts * 2)) * TAU + hash(seed * 3.1) * 2;
    const rr = r * (i % 2 ? 1 : 0.70 + hash(i + seed * 5) * 0.10);
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.95;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath(); g.fillStyle = C.hair; g.fill();
}

function patchRect(g, x, y, w, h, rot, col, stitch) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = col; g.fillRect(-w / 2, -h / 2, w, h);
  if (stitch) {
    g.strokeStyle = stitch; g.lineWidth = 0.7; g.setLineDash([1.4, 1.2]);
    g.strokeRect(-w / 2, -h / 2, w, h); g.setLineDash([]);
  }
  g.restore();
}

/* =========================================================================
   주인공 — 남자 / 누더기 옷 / 더벅머리 / 검
   ========================================================================= */
const HERO = {
  gap: 1.7, N: 74,
  headY: 86, headTop: 114, headR: 13.0,
  faceY: 98.6,
};
const HERO_RX = [[0, 5.8], [0.08, 9.0], [0.20, 11.6], [0.38, 12.9], [0.58, 13.4], [0.76, 13.5], [0.90, 13.0], [1.0, 11.4]];

function heroSlice(g, h, z) {
  /* ---- 발/부츠 0 ~ 7 ---- */
  if (h <= 7) {
    for (const s of [-1, 1]) {
      disc(g, s * 6.0, 2.6, 5.3, 6.3, C.boot);
      if (h > 2.2 && h < 5.0) disc(g, s * 6.0, 6.2, 3.3, 2.1, '#4c392c');   // 발끝
      if (h > 4.6 && h < 6.8) disc(g, s * 6.0, -2.0, 3.1, 2.5, C.bandageLo); // 발목 붕대
    }
    return;
  }
  /* ---- 정강이 + 붕대 감은 다리 7 ~ 18 ---- */
  if (h <= 18) {
    const band = (h - 7) % 4.4;
    for (const s of [-1, 1]) {
      disc(g, s * 6.0, 1.3, 4.5, 4.9, C.pants);
      if (band < 1.3) disc(g, s * 6.0, 1.3, 4.35, 4.75, C.bandage);
      else if (band < 2.5) disc(g, s * 6.0, 1.3, 3.4, 3.8, C.bandageLo);
    }
    return;
  }
  /* ---- 허벅지 + 기운 누더기 바지 18 ~ 34 ---- */
  if (h <= 34) {
    const t = (h - 18) / 16;
    for (const s of [-1, 1]) ragged(g, s * 5.9, 0.8, 5.2 + 0.5 * t, 5.6 + 0.5 * t, C.pants, null, 11 + s * 3, 0.05, 18);
    if (h > 28) { const k = (h - 28) / 6; ragged(g, 0, 0.4, 10.3 + 1.2 * k, 8.8 + 0.9 * k, C.tunic, null, 23, 0.17, 24); }
    return;
  }
  /* ---- 골반 / 튜닉 자락 / 밧줄 벨트 34 ~ 46 ---- */
  if (h <= 46) {
    const t = smooth((h - 34) / 12);
    const rx = 10.4 + 2.9 * t, ry = 8.7 + 2.0 * t;
    ragged(g, 0, 0.3, rx, ry, C.tunic, null, 31, 0.055, 30);
    if (h > 35 && h < 39.5) patchRect(g, -5.6, -1.4, 5.4, 4.2, 0.35, C.patch, C.stitch);
    if (h > 37 && h < 41) patchRect(g, 6.0, 2.8, 4.2, 3.4, -0.5, C.patch2, C.stitch);
    // 앞으로 늘어진 천 조각
    if (h > 33 && h < 46) {
      g.fillStyle = (h > 40 && h < 44) ? C.ropeLo : C.tunicDark;
      g.fillRect(-2.6, ry * 0.62, 5.2, 3.0);
      if (h > 36 && h < 39) { g.fillStyle = C.patch2; g.fillRect(-2.4, ry * 0.66, 4.8, 2.4); }
    }
    if (h > 38.6 && h < 40.8) { // 자락 끝 너덜너덜
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * TAU + 0.1;
        g.beginPath();
        g.moveTo(Math.cos(a) * rx * 0.88, 0.3 + Math.sin(a) * ry * 0.88);
        g.lineTo(Math.cos(a) * rx * 1.04, 0.3 + Math.sin(a) * ry * 1.08);
        g.strokeStyle = C.tunicLo; g.lineWidth = 1.7; g.stroke();
      }
    }
    if (h >= 40.8 && h <= 44.4) { // 밧줄 벨트
      disc(g, 0, 0.3, rx * 1.0, ry * 1.02, C.rope);
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU;
        g.save(); g.translate(Math.cos(a) * rx * 0.8, 0.3 + Math.sin(a) * ry * 0.8);
        g.rotate(a + 0.5); g.fillStyle = 'rgba(70,54,26,0.85)'; g.fillRect(-1.7, -1.0, 3.4, 2.0); g.restore();
      }
      if (h > 41.8 && h < 43.8) { g.fillStyle = '#c0a86c'; g.fillRect(-2.8, ry * 0.52, 5.6, 3.2); g.fillStyle = '#6d5a33'; g.fillRect(-1.3, ry * 0.6, 2.6, 1.7); }
    }
    return;
  }
  /* ---- 상체 + 팔 + 어깨 46 ~ 78 ---- */
  if (h <= 78) {
    const t = (h - 46) / 32;
    const k = Math.sin(Math.min(1, t * 1.35) * Math.PI * 0.5);
    const rx = 10.8 + 3.0 * k, ry = 8.8 + 1.9 * k;
    ragged(g, 0, 0, rx, ry, C.tunic, null, 41, 0.04, 34);
    // 옷 주름
    if (h > 50 && h < 72) {
      for (let i = 0; i < 4; i++) {
        const a = -0.95 + i * 0.62;
        g.beginPath();
        g.moveTo(Math.cos(a) * rx * 0.25, Math.sin(a) * ry * 0.25);
        g.lineTo(Math.cos(a) * rx * 0.9, Math.sin(a) * ry * 0.9);
        g.strokeStyle = 'rgba(38,30,24,0.26)'; g.lineWidth = 1.0; g.stroke();
      }
    }
    // 대각선 가죽끈
    const sxp = lerp(-8.6, 8.6, t);
    g.save(); g.translate(sxp, 0.5); g.rotate(0.30);
    g.globalAlpha = 0.85;
    g.fillStyle = '#4b3a2b'; g.fillRect(-1.9, -ry * 0.8, 3.8, ry * 1.6);
    g.fillStyle = 'rgba(150,120,80,0.22)'; g.fillRect(-1.9, -ry * 0.8, 0.9, ry * 1.6);
    g.globalAlpha = 1;
    g.restore();
    if (h > 49 && h < 54.5) patchRect(g, -6.6, -2.0, 5.6, 4.4, 0.30, C.patch, C.stitch);
    // 찢긴 자국
    if ((h > 57 && h < 60.5) || (h > 63 && h < 66)) {
      g.fillStyle = '#2a2019';
      g.beginPath(); g.moveTo(3.4, 3.0); g.lineTo(7.4, 4.6); g.lineTo(4.0, 5.4); g.closePath(); g.fill();
    }
    // 어깨에서 늘어진 천 조각
    if (h > 62 && h < 73) {
      const k = (h - 62) / 11;
      g.fillStyle = k < 0.25 ? C.tunic : C.tunicDark;
      g.fillRect(-11.5 - k * 1.5, 2.0, 3.6, 3.0);
    }
    if (h > 55 && h < 59) patchRect(g, 6.2, 1.6, 4.4, 3.6, -0.4, C.patch2, C.stitch);
    // 목선(피부)
    if (h > 70) { const kk = (h - 70) / 8; disc(g, 0, 4.2, 3.7 * (1 - kk * 0.42), 2.7 * (1 - kk * 0.3), C.skin); }
    // 팔
    for (const s of [-1, 1]) {
      if (h > 48 && h < 66.5) {
        const yb = s > 0 ? -1.0 : 2.6;
        disc(g, s * 16.4, yb, 4.6, 4.9, C.tunicDark);
        if (h > 62) { // 소매 너덜
          for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU; g.beginPath(); g.moveTo(s * 16.4 + Math.cos(a) * 3.2, yb + Math.sin(a) * 3.2); g.lineTo(s * 16.4 + Math.cos(a) * 4.5, yb + Math.sin(a) * 4.5); g.strokeStyle = C.tunicLo; g.lineWidth = 1.3; g.stroke(); }
        }
      } else if (h >= 66.5 && h < 73) {
        const yb = s > 0 ? -0.8 : 3.1;
        disc(g, s * 16.9, yb, 3.5, 3.7, C.bandage);
        if (h > 67.5 && h < 69.5) disc(g, s * 16.9, yb, 3.5, 3.7, C.bandageLo);
        if (h > 70.5 && h < 72) disc(g, s * 16.9, yb, 3.5, 3.7, C.bandageLo);
      } else if (h >= 73 && h < 77) {
        const yb = s > 0 ? -0.8 : 3.3;
        disc(g, s * 17.1, yb, 3.3, 3.5, C.skin);
      }
    }
    // 어깨 천
    if (h > 69 && h < 78) {
      for (const s of [-1, 1]) ragged(g, s * 13.8, -1.4, 5.8, 6.0, C.tunicDark, null, 51 + s * 3, 0.09, 16);
    }
    return;
  }
  /* ---- 목 78 ~ 86 ---- */
  if (h <= 86) {
    disc(g, 0, 0.6, 5.1, 5.1, C.skinShade);
    return;
  }
  /* ---- 머리 86 ~ 114 ---- */
  if (h <= 114) {
    const t = (h - 86) / 28;
    const rx = interp(HERO_RX, t), ry = rx * 0.96;
    // 두상(피부)
    disc(g, 0, 0.6, rx, ry, C.skin);
    // 머리카락: 뒤통수 + 옆머리 (이마 위 이마선에서 자른다)
    const crown = smoothstep(0.50, 1.0, t);
    const hairLine = lerp(-0.06, 0.98, crown) * ry;
    g.save();
    g.beginPath(); g.ellipse(0, -0.9, rx * 1.13, ry * 1.13, 0, 0, TAU); g.clip();
    g.fillStyle = C.hair;
    g.fillRect(-rx * 1.3, -ry * 1.4, rx * 2.6, hairLine + ry * 1.4);
    // 앞으로 흘러내린 옆머리
    if (crown < 0.95) {
      const lockR = ry * 0.86 * (1 - crown * 0.4);
      for (const sd of [-1, 1]) {
        g.beginPath();
        g.ellipse(sd * rx * 0.92, -0.2 * ry, rx * 0.34, lockR, 0, 0, TAU);
        g.fill();
      }
    }
    g.restore();
    // 이마선 경계 정리(머리카락 뿌리 그림자)
    if (crown < 0.98) {
      g.save();
      g.beginPath(); g.ellipse(0, -0.9, rx * 1.13, ry * 1.13, 0, 0, TAU); g.clip();
      g.globalAlpha = 0.35; g.fillStyle = '#000000';
      g.fillRect(-rx * 1.3, hairLine - 1.6, rx * 2.6, 2.2);
      g.globalAlpha = 1; g.restore();
    }
    // 삐죽 튀어나온 옆/뒷머리 (더벅머리)
    if (t > 0.34 && t < 0.98) {
      const locks = [[0.10, 0.97, 3.4], [Math.PI - 0.10, 0.97, 3.4], [-1.05, 0.95, 3.8], [Math.PI + 1.05, 0.95, 3.8], [-Math.PI / 2, 1.0, 3.2]];
      for (let li = 0; li < locks.length; li++) {
        const lk = locks[li];
        const grow = smoothstep(0.34, 0.55, t);
        const rr = lk[2] * grow * (0.8 + 0.2 * Math.sin(t * 6 + li));
        if (rr < 0.8) continue;
        spiky(g, Math.cos(lk[0]) * rx * lk[1], -1.0 + Math.sin(lk[0]) * ry * lk[1], rr, li + 20, 5);
      }
    }
    // 귀
    if (t > 0.34 && t < 0.55) for (const sd of [-1, 1]) disc(g, sd * (rx * 0.99), 0.6, 2.4, 2.7, C.skinShade);
    // 턱 그늘
    if (t < 0.18) disc(g, 0, ry * 0.52, rx * 0.58, ry * 0.30, C.skinShade);
    return;
  }
  /* ---- 삐죽삐죽 더벅머리 (머리 위) 114 ~ 126 ---- */
  {
    const t2 = (h - 114) / 9.5;
    if (t2 < -0.06 || t2 > 1.02) return;
    // 정수리 바탕 (tuft 사이로 배경이 비치지 않게)
    if (t2 < 0.62) {
      const kk = 1 - t2 / 0.62;
      disc(g, 0, -0.8, 10.6 * (0.55 + 0.45 * kk), 10.0 * (0.55 + 0.45 * kk), C.hair);
    }
    const tufts = [
      { x: 0.2, y: -0.8, r: 7.0, h1: 0.50 },
      { x: 4.2, y: 0.2, r: 5.6, h1: 0.72 },
      { x: -4.0, y: 0.4, r: 4.8, h1: 0.88 },
      { x: -1.2, y: -2.6, r: 4.4, h1: 1.00 },
    ];
    for (const tf of tufts) {
      if (t2 >= -0.05 && t2 <= tf.h1) {
        const k = clamp(t2 / tf.h1, 0, 1);
        const rr = tf.r * Math.cos(k * Math.PI * 0.42);
        disc(g, tf.x, tf.y, rr, rr * 0.94, C.hair);
      }
    }
    if (t2 > 0.55) {
      const wisps = [[-6.8, -3.6, 4.0], [6.2, -4.0, 3.2], [1.0, 4.2, 2.6]];
      for (let i = 0; i < wisps.length; i++) {
        const wp = wisps[i];
        const k = clamp((t2 - 0.55) / 0.42, 0, 1);
        spiky(g, wp[0], wp[1], wp[2] * (1 - k) + 0.4, i + 7, 6);
      }
    }
    return;
  }
}

function applyTint(cv, a) {
  if (Math.abs(a) < 0.004) return;
  const g = cv.getContext('2d');
  g.save();
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = a > 0 ? 'rgba(8,5,3,' + a + ')' : 'rgba(255,240,220,' + (-a) + ')';
  g.fillRect(0, 0, cv.width, cv.height);
  g.restore();
}
/* 스택 전체에 수직 조명을 굽는다 (아래는 어둡고 위로 갈수록 밝게) */
function verticalLight(z, n) {
  const t = z / (n - 1);
  return 0.26 * Math.pow(1 - Math.min(1, t / 0.42), 1.4) - 0.05 * Math.max(0, t - 0.72) / 0.28;
}

function buildHeroStack() {
  const slices = [];
  for (let z = 0; z < HERO.N; z++) {
    const c = mkSlice(g => heroSlice(g, z * HERO.gap, z));
    applyTint(c, verticalLight(z, HERO.N));
    slices.push(c);
  }
  return { slices, gap: HERO.gap, height: HERO.N * HERO.gap };
}

/* 얼굴 앞면 판(정면 데칼) ------------------------------------------------
   스태킹 단면만으로는 눈/코/입이 띠처럼 뭉개지므로, 얼굴 접평면에
   정면 텍스처를 붙여 각도에 따라 자연스럽게 줄어들며 사라지게 한다. */
const FACE_W = 72, FACE_H = 88;   // 스프라이트 픽셀
const FACE_WORLD_W = 22.5, FACE_WORLD_H = 29.5;
function buildFaceSprite() {
  const c = newCanvas(FACE_W, FACE_H), g = c.getContext('2d');
  g.scale(2, 2);
  const cx = FACE_W / 4, cy = FACE_H / 4 + 1;
  // 피부 베이스 (가장자리로 갈수록 투명)
  g.save(); g.translate(cx, cy); g.scale(1, 1.30);
  const rg = g.createRadialGradient(0, 0, 5, 0, 0, 13.2);
  rg.addColorStop(0, 'rgba(216,163,114,1)');
  rg.addColorStop(0.72, 'rgba(213,160,112,1)');
  rg.addColorStop(0.90, 'rgba(206,152,105,0.55)');
  rg.addColorStop(1, 'rgba(200,146,100,0)');
  g.beginPath(); g.arc(0, 0, 13.2, 0, TAU); g.fillStyle = rg; g.fill(); g.restore();
  // 광대/관자 음영
  g.globalAlpha = 0.30; g.fillStyle = C.skinShade;
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * 9.6, cy + 1.5, 2.6, 6.4, s * 0.16, 0, TAU); g.fill(); }
  g.globalAlpha = 0.34; g.beginPath(); g.ellipse(cx, cy + 11.5, 7.4, 3.0, 0, 0, TAU); g.fill(); // 턱 밑 그늘
  g.globalAlpha = 0.22; g.beginPath(); g.ellipse(cx, cy - 8.5, 7.0, 3.4, 0, 0, TAU); g.fill(); // 이마 그늘
  g.globalAlpha = 1;
  // 턱선 윤곽
  g.strokeStyle = 'rgba(120,78,44,0.55)'; g.lineWidth = 1.1;
  g.beginPath(); g.moveTo(cx - 8.2, cy + 4.5); g.quadraticCurveTo(cx - 6.4, cy + 12.2, cx, cy + 13.4);
  g.quadraticCurveTo(cx + 6.4, cy + 12.2, cx + 8.2, cy + 4.5); g.stroke();
  // 눈 (어두운 눈동자 + 흰 점)
  for (const s of [-1, 1]) {
    const ex = cx + s * 5.1, ey = cy - 0.4;
    g.fillStyle = '#1a1310';
    g.beginPath(); g.ellipse(ex, ey, 2.7, 2.0, s * 0.05, 0, TAU); g.fill();
    g.fillStyle = '#3a2a20';
    g.beginPath(); g.ellipse(ex, ey + 0.4, 1.9, 1.35, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.ellipse(ex + s * 0.9, ey - 0.7, 0.7, 0.65, 0, 0, TAU); g.fill();
    // 눈꺼풀 선
    g.strokeStyle = 'rgba(60,36,22,0.75)'; g.lineWidth = 1.0;
    g.beginPath(); g.moveTo(ex - 3.6, ey - 2.0); g.quadraticCurveTo(ex, ey - 3.4, ex + 3.6, ey - 2.0); g.stroke();
    // 눈썹 (짙고 비대칭)
    g.save(); g.translate(cx + s * 5.6, ey - 4.4); g.rotate(s * 0.16);
    g.strokeStyle = '#2a1e15'; g.lineWidth = 1.7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-3.2, 1.0); g.quadraticCurveTo(0, -1.2, 3.2, 0.3); g.stroke();
    g.restore();
  }
  // 코 (콧대 하이라이트 + 콧방울 그늘)
  g.fillStyle = 'rgba(240,200,160,0.85)';
  g.beginPath(); g.moveTo(cx - 1.0, cy + 1.6); g.lineTo(cx + 1.0, cy + 1.6); g.lineTo(cx + 1.5, cy + 6.4); g.lineTo(cx - 1.5, cy + 6.4); g.closePath(); g.fill();
  g.fillStyle = 'rgba(150,96,56,0.55)';
  g.beginPath(); g.ellipse(cx, cy + 7.0, 2.6, 1.3, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(120,74,42,0.42)';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * 2.1, cy + 6.6, 0.85, 0.6, 0, 0, TAU); g.fill(); }
  // 입
  g.strokeStyle = 'rgba(96,48,40,0.92)'; g.lineWidth = 1.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - 3.4, cy + 11.0); g.quadraticCurveTo(cx, cy + 12.2, cx + 3.4, cy + 11.0); g.stroke();
  g.strokeStyle = 'rgba(240,180,150,0.45)'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(cx - 2.6, cy + 12.1); g.quadraticCurveTo(cx, cy + 12.9, cx + 2.6, cy + 12.1); g.stroke();
  // 수염 자국
  g.globalAlpha = 0.12; g.fillStyle = '#2b211a';
  g.beginPath(); g.ellipse(cx, cy + 10.4, 7.4, 3.6, 0, 0, TAU); g.fill();
  g.globalAlpha = 1;
  // 앞머리 (이마 위에서 갈라짐) — 눈은 절대 덮지 않는다
  g.fillStyle = C.hair;
  g.beginPath(); g.moveTo(cx - 12.5, cy - 5.0);
  g.quadraticCurveTo(cx - 12.0, cy - 13.5, cx - 2.6, cy - 14.6);
  g.quadraticCurveTo(cx - 4.2, cy - 9.6, cx - 3.4, cy - 5.6);
  g.quadraticCurveTo(cx - 7.0, cy - 6.4, cx - 12.5, cy - 5.0);
  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx + 12.5, cy - 5.2);
  g.quadraticCurveTo(cx + 12.2, cy - 13.8, cx + 2.4, cy - 14.6);
  g.quadraticCurveTo(cx + 3.6, cy - 9.8, cx + 2.6, cy - 5.8);
  g.quadraticCurveTo(cx + 7.2, cy - 6.6, cx + 12.5, cy - 5.2);
  g.closePath(); g.fill();
  // 옆머리 갈래
  g.beginPath(); g.moveTo(cx - 12.8, cy - 6.0); g.quadraticCurveTo(cx - 14.6, cy + 2, cx - 12.2, cy + 6.0);
  g.quadraticCurveTo(cx - 10.6, cy + 1, cx - 10.4, cy - 5.0); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx + 12.8, cy - 6.2); g.quadraticCurveTo(cx + 14.8, cy + 1.6, cx + 12.0, cy + 5.6);
  g.quadraticCurveTo(cx + 10.4, cy + 0.8, cx + 10.2, cy - 5.2); g.closePath(); g.fill();
  // 가장자리 페이드 (각도가 돌아가도 붙인 티가 나지 않게)
  g.globalCompositeOperation = 'destination-in';
  g.save(); g.translate(cx, cy); g.scale(1, 1.24);
  const m = g.createRadialGradient(0, 0, 10.5, 0, 0, 17.2);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.80, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.beginPath(); g.arc(0, 0, 17.4, 0, TAU); g.fill(); g.restore();
  g.globalCompositeOperation = 'source-over';
  return c;
}
const FACE_SPRITE = buildFaceSprite();

/* =========================================================================
   적 / 소품 스택
   ========================================================================= */
function buildSlimeStack() {
  const N = 20, gap = 2.1, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap, t = h / ((N - 1) * gap);
    slices.push(mkSlice(g => {
      const r = 15.8 * Math.pow(Math.sin(Math.PI * (0.17 + 0.76 * t)), 0.72);
      if (r < 0.5) return;
      // 바닥 그림자/끈적한 테두리
      disc(g, 0, 1.2, r, r * 0.95, t < 0.1 ? C.slimeDark : C.slime, null, C.slimeDark);
      if (t > 0.18) disc(g, 0, 0.6, r * 0.78, r * 0.74, C.slimeHi, null, null);
      // 점액 방울
      for (let i = 0; i < 3; i++) {
        const a = hash(z * 3 + i * 7) * TAU, rr = r * (0.35 + hash(i + z) * 0.4);
        disc(g, Math.cos(a) * rr, Math.sin(a) * rr * 0.8, 1.4, 1.3, 'rgba(255,255,255,0.35)');
      }
      // 눈
      if (t > 0.42 && t < 0.76) {
        for (const s of [-1, 1]) {
          g.fillStyle = '#0e1c0c'; g.beginPath(); g.ellipse(s * 5.0, r * 0.55, 3.0, 3.2, 0, 0, TAU); g.fill();
          g.fillStyle = '#f4fff0'; g.beginPath(); g.ellipse(s * 5.0 + 1.0, r * 0.55 - 1.0, 1.0, 1.0, 0, 0, TAU); g.fill();
        }
        if (t > 0.55 && t < 0.66) {
          g.strokeStyle = '#0e1c0c'; g.lineWidth = 1.4;
          g.beginPath(); g.ellipse(0, r * 0.78, 2.6, 1.2, 0, 0.2, Math.PI - 0.2); g.stroke();
        }
      }
    }));
  }
  return { slices, gap, height: N * gap };
}

function buildGoblinStack() {
  const N = 40, gap = 2.2, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap;
    slices.push(mkSlice(g => {
      if (h <= 6) { // 발
        for (const s of [-1, 1]) disc(g, s * 5.4, 2.4, 4.6, 5.6, C.gobLeather, null, '#33251a');
        return;
      }
      if (h <= 18) { // 다리
        for (const s of [-1, 1]) disc(g, s * 5.4, 1.0, 4.0, 4.4, C.gobLo, null, '#2d3719');
        return;
      }
      if (h <= 50) { // 몸통 (앞으로 굽은)
        const t = (h - 18) / 32;
        const rx = 10.5 + 3.2 * Math.sin(t * Math.PI * 0.8), ry = 8.4 + 1.8 * Math.sin(t * Math.PI);
        ragged(g, 0, 1.4, rx, ry, C.gobLeather, '#33251a', z * 3.3, 0.06, 24);
        // 가죽끈
        for (let i = 0; i < 3; i++) { g.strokeStyle = 'rgba(35,25,15,0.6)'; g.lineWidth = 1.3; g.beginPath(); g.ellipse(0, 1.4, rx * (0.45 + i * 0.22), ry * (0.45 + i * 0.22), 0, -0.7, 2.4); g.stroke(); }
        // 팔
        for (const s of [-1, 1]) disc(g, s * 13.0, 2.2, 3.6, 3.9, C.gob, null, C.gobLo);
        if (h > 48) disc(g, 0, 2.0, 4.2, 4.2, C.gob, null, C.gobLo);
        return;
      }
      if (h <= 84) { // 머리
        const t = (h - 50) / 34;
        const rx = 11.5 * Math.sin(Math.PI * (0.22 + 0.72 * t)) + 1.2;
        disc(g, 0, 1.6, rx, rx * 0.95, C.gob, C.gobHi, C.gobLo);
        // 귀 (옆으로 뾰족)
        if (t > 0.30 && t < 0.62) {
          for (const s of [-1, 1]) {
            g.beginPath(); g.moveTo(s * rx * 0.8, 1.0); g.lineTo(s * (rx + 7.5), -2.2); g.lineTo(s * (rx + 7.0), 3.4); g.closePath();
            g.fillStyle = C.gob; g.fill(); g.strokeStyle = C.gobLo; g.lineWidth = 1; g.stroke();
          }
        }
        // 눈
        if (t > 0.45 && t < 0.62) {
          for (const s of [-1, 1]) { g.fillStyle = '#ffd454'; g.beginPath(); g.ellipse(s * 4.4, rx * 0.55, 2.6, 1.9, 0, 0, TAU); g.fill(); g.fillStyle = '#20140a'; g.beginPath(); g.ellipse(s * 4.4, rx * 0.55, 0.9, 1.6, 0, 0, TAU); g.fill(); }
        }
        // 이빨
        if (t > 0.18 && t < 0.28) { g.fillStyle = '#f2ecd8'; g.beginPath(); g.moveTo(-1.6, rx * 0.85); g.lineTo(-0.4, rx * 0.85); g.lineTo(-1.0, rx * 0.6); g.closePath(); g.fill(); }
        // 머리카락
        if (t > 0.7) { g.fillStyle = C.hairLo; g.beginPath(); g.ellipse(0, -rx * 0.35, rx * 0.95, rx * 0.5, 0, 0, TAU); g.fill(); }
        return;
      }
      const t2 = (h - 84) / 6;
      if (t2 < 1) spiky(g, 0, -1, 4.2 * (1 - t2) + 1, z, 7);
    }));
  }
  return { slices, gap, height: N * gap };
}

function buildMageStack() {
  const N = 42, gap = 2.2, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap;
    slices.push(mkSlice(g => {
      if (h <= 62) { // 로브 (아래로 갈수록 넓은 원뿔)
        const t = h / 62;
        const r = 16.5 - 9.6 * smooth(t);
        ragged(g, 0, 0.8, r, r * 0.92, C.magRobe, C.magRobeLo, z * 4.7, 0.06 + 0.03 * (1 - t), 26);
        // 로브 세로 주름
        for (let i = 0; i < 5; i++) {
          const a = -0.9 + i * 0.45;
          g.strokeStyle = 'rgba(20,12,35,0.35)'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2); g.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92); g.stroke();
        }
        if (h > 30 && h < 36) { g.strokeStyle = C.magRobeHi; g.lineWidth = 1.6; g.beginPath(); g.ellipse(0, 0.8, r * 0.99, r * 0.91, 0, 0, TAU); g.stroke(); }
        return;
      }
      if (h <= 86) { // 후드
        const t = (h - 62) / 24;
        const r = 10.5 * Math.sin(Math.PI * (0.30 + 0.65 * t)) + 1.4;
        disc(g, 0, 1.2, r, r * 1.02, C.magRobe, C.magRobeHi, C.magRobeLo);
        // 후드 안쪽 어둠 + 빛나는 눈
        if (t > 0.22 && t < 0.55) {
          g.fillStyle = '#140f21'; g.beginPath(); g.ellipse(0, r * 0.48, r * 0.62, r * 0.42, 0, 0, TAU); g.fill();
          if (t > 0.32 && t < 0.48) {
            for (const s of [-1, 1]) {
              g.fillStyle = C.magGlow; g.beginPath(); g.ellipse(s * 3.2, r * 0.52, 1.5, 1.2, 0, 0, TAU); g.fill();
              g.globalAlpha = 0.35; g.beginPath(); g.ellipse(s * 3.2, r * 0.52, 3.4, 2.6, 0, 0, TAU); g.fill(); g.globalAlpha = 1;
            }
          }
        }
        return;
      }
      const t2 = (h - 86) / 6;
      if (t2 < 1) { // 후드 뾰족 끝
        g.beginPath(); g.moveTo(-5 * (1 - t2), -1); g.quadraticCurveTo(0, -6 * (1 - t2) - 1, 5 * (1 - t2), -1); g.closePath();
        g.fillStyle = C.magRobe; g.fill();
      }
    }));
  }
  return { slices, gap, height: N * gap };
}

function buildPillarStack() {
  const N = 27, gap = 2.5, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap;
    slices.push(mkSlice(g => {
      let r;
      if (h <= 6) r = 17 - h * 0.55;
      else if (h <= 9) r = 13.6;
      else if (h <= 54) r = 11.4;
      else if (h <= 60) r = 11.4 + (h - 54) * 0.58;
      else r = 15.0;
      if (r <= 0.5) return;
      g.save(); g.beginPath(); g.ellipse(0, 0, r, r * 0.97, 0, 0, TAU); g.clip();
      g.fillStyle = C.stone; g.fillRect(-r, -r * 1.1, r * 2, r * 2.2);
      // 돌 얼룩
      for (let i = 0; i < 6; i++) {
        const a2 = hash(z * 5.3 + i * 2.1) * TAU, rr = r * (0.15 + hash(i * 3.3 + z) * 0.75);
        g.fillStyle = i % 2 ? 'rgba(160,162,172,0.18)' : 'rgba(52,54,62,0.22)';
        g.beginPath(); g.ellipse(Math.cos(a2) * rr, Math.sin(a2) * rr, r * 0.30, r * 0.22, a2, 0, TAU); g.fill();
      }
      // 돌 켜(블록 이음)
      if (z % 6 === 0) {
        g.fillStyle = 'rgba(24,25,30,0.30)';
        g.fillRect(-r, -r * 1.1, r * 2, r * 2.2);
        g.globalCompositeOperation = 'destination-out';
        g.beginPath(); g.ellipse(0, 0, r * 0.94, r * 0.91, 0, 0, TAU); g.fill();
        g.globalCompositeOperation = 'source-over';
      }
      g.restore();
      g.beginPath(); g.ellipse(0, 0, r, r * 0.97, 0, 0, TAU);
      g.strokeStyle = 'rgba(28,29,34,0.55)'; g.lineWidth = 1.2; g.stroke();
    }));
  }
  return { slices, gap, height: N * gap };
}

function buildCrateStack() {
  const N = 17, gap = 2.5, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap;
    slices.push(mkSlice(g => {
      const H = (N - 1) * gap;
      const t = h / H;
      let s = 14.2;
      if (h < 2.5) s = 12.4 + h * 0.72;
      else if (h > H - 3.5) s = 14.2 - (h - (H - 3.5)) * 0.55;
      g.save();
      const rr = 1.6;
      g.beginPath();
      g.moveTo(-s + rr, -s); g.lineTo(s - rr, -s); g.quadraticCurveTo(s, -s, s, -s + rr);
      g.lineTo(s, s - rr); g.quadraticCurveTo(s, s, s - rr, s);
      g.lineTo(-s + rr, s); g.quadraticCurveTo(-s, s, -s, s - rr);
      g.lineTo(-s, -s + rr); g.quadraticCurveTo(-s, -s, -s + rr, -s);
      g.closePath();
      g.fillStyle = C.wood; g.fill();
      g.save(); g.clip();
      // 널빤지 이음
      for (let i = 1; i < 3; i++) {
        g.fillStyle = 'rgba(60,40,20,0.45)';
        g.fillRect(-s, -s + (i * s * 2) / 3 - 1, s * 2, 1.8);
      }
      // 나뭇결
      g.globalAlpha = 0.25; g.fillStyle = C.woodHi;
      g.fillRect(-s, -s + 1.5, s * 2, 1.6);
      g.globalAlpha = 1;
      // 대각 쇠장식
      if (t > 0.12 && t < 0.92) {
        g.strokeStyle = 'rgba(48,50,58,0.75)'; g.lineWidth = 2.6;
        g.beginPath(); g.moveTo(-s, -s); g.lineTo(s, s); g.stroke();
      }
      g.restore();
      g.strokeStyle = C.woodLo; g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(-s + rr, -s); g.lineTo(s - rr, -s); g.quadraticCurveTo(s, -s, s, -s + rr);
      g.lineTo(s, s - rr); g.quadraticCurveTo(s, s, s - rr, s);
      g.lineTo(-s + rr, s); g.quadraticCurveTo(-s, s, -s, s - rr);
      g.lineTo(-s, -s + rr); g.quadraticCurveTo(-s, -s, -s + rr, -s);
      g.closePath(); g.stroke();
      g.restore();
    }));
  }
  return { slices, gap, height: N * gap };
}

function buildBrazierStack() {
  const N = 14, gap = 2.4, slices = [];
  for (let z = 0; z < N; z++) {
    const h = z * gap;
    slices.push(mkSlice(g => {
      if (h <= 12) { // 쇠 삼발이
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * TAU + 0.4;
          disc(g, Math.cos(a) * 7.5, Math.sin(a) * 7.5, 2.2, 2.4, C.iron, C.ironHi, '#20222a');
        }
        disc(g, 0, 0, 4.0, 4.0, C.iron, C.ironHi, '#20222a');
        return;
      }
      if (h <= 22) { // 화로 그릇
        disc(g, 0, 0, 10.5, 10.5, C.iron, C.ironHi, '#20222a');
        g.beginPath(); g.ellipse(0, 0, 7.6, 7.6, 0, 0, TAU); g.fillStyle = '#2a2018'; g.fill();
        return;
      }
      // 숯
      const t = (h - 22) / 11;
      const r = 7.4 * (1 - t * 0.5);
      disc(g, 0, 0, r, r, '#3a1f12');
      for (let i = 0; i < 4; i++) {
        const a = hash(z + i * 3) * TAU, rr = hash(i * 5 + z) * r * 0.7;
        disc(g, Math.cos(a) * rr, Math.sin(a) * rr, 1.7, 1.6, i % 2 ? '#ff7b2e' : '#ffb055');
      }
    }));
  }
  return { slices, gap, height: N * gap };
}

const STACKS = {};

/* =========================================================================
   스택 렌더러
   ========================================================================= */
function drawStack(g, stack, wx, wz, angle, o) {
  o = o || {};
  const zoom = o.zoom === undefined ? CAM.zoom : o.zoom;
  const yScale = o.yScale === undefined ? CAM.yScale : o.yScale;
  const sx = o.sx === undefined ? scrX(wx) : o.sx;
  const sy = o.sy === undefined ? scrY(0, wz) : o.sy;
  const scaleX = o.scaleX === undefined ? 1 : o.scaleX;
  const scaleY = o.scaleY === undefined ? 1 : o.scaleY;
  const lean = o.lean || 0;
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  const gap = stack.gap;
  g.save();
  g.globalAlpha = alpha;
  if (o.tint) g.filter = o.tint;
  g.translate(sx, sy + (o.yOff || 0));
  g.scale(zoom * scaleX, zoom * scaleY);
  const n = stack.slices.length;
  for (let i = 0; i < n; i++) {
    const s = stack.slices[i];
    if (!s) continue;
    g.save();
    g.translate(lean * i * gap * (o.leanH ? o.leanH : 1), -i * gap);
    g.scale(1, yScale);
    g.rotate(-angle - (o.twist ? o.twist * (i / (n - 1)) : 0));
    g.drawImage(s, -s.width / 2, -s.height / 2);
    g.restore();
  }
  g.restore();
  if (o.tint) g.filter = 'none';
}

/* 바닥 그림자 */
function drawShadow(g, wx, wz, r, alpha, yo) {
  const sx = scrX(wx), sy = scrY(0, wz) + (yo || 0);
  g.save();
  g.translate(sx, sy); g.scale(1, CAM.yScale);
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, r * CAM.zoom);
  grd.addColorStop(0, 'rgba(8,6,10,' + (alpha === undefined ? 0.42 : alpha) + ')');
  grd.addColorStop(0.65, 'rgba(8,6,10,' + (alpha === undefined ? 0.24 : alpha * 0.55) + ')');
  grd.addColorStop(1, 'rgba(8,6,10,0)');
  g.beginPath(); g.arc(0, 0, r * CAM.zoom, 0, TAU); g.fillStyle = grd; g.fill();
  g.restore();
}

/* 얼굴 접평면 데칼 */
function drawFace(g, wx, wz, angle, y) {
  const v = Math.cos(angle);           // 카메라(남쪽)를 향할수록 1
  if (v <= 0.06) return;
  const nx = Math.sin(angle), nz = Math.cos(angle);
  const fx = wx + nx * (HERO.headR * 0.58), fz = wz + nz * (HERO.headR * 0.58);
  const ax = scrX(fx), ay = scrY(y === undefined ? HERO.faceY : y, fz);
  const z = CAM.zoom;
  const a = smoothstep(0.02, 0.42, v);
  g.save();
  g.globalAlpha = a * (0.72 + 0.28 * v);
  // 정면 접평면: 가로축은 접선 방향(카메라 각도만큼 기울고 줄어든다)
  g.translate(ax, ay);
  g.transform(Math.cos(angle) * z, -Math.sin(angle) * CAM.yScale * z, 0, z, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(FACE_SPRITE, -FACE_WORLD_W / 2, -FACE_WORLD_H / 2, FACE_WORLD_W, FACE_WORLD_H);
  g.imageSmoothingEnabled = false;
  g.restore();
}

/* 검: 손잡이에서 칼끝까지 단면 슬라이스를 축방향으로 쌓아 만든 3D 검 */
function drawSword(g, hx, hy, hz, dir, pitch, len, glow, alpha) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const nx = Math.sin(dir) * cp, ny = sp, nz = Math.cos(dir) * cp;
  const tx = hx + nx * len, ty = hy + ny * len, tz = hz + nz * len;
  const P0 = { x: scrX(hx), y: scrY(hy, hz) };
  const P1 = { x: scrX(tx), y: scrY(ty, tz) };
  const dx = P1.x - P0.x, dy = P1.y - P0.y;
  const L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const Z = CAM.zoom;
  g.save();
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  g.lineCap = 'round';
  // --- 자루
  const gx0 = P0.x - ux * 11 * Z, gy0 = P0.y - uy * 11 * Z;
  g.beginPath(); g.moveTo(gx0, gy0); g.lineTo(P0.x + ux * 4 * Z, P0.y + uy * 4 * Z);
  g.strokeStyle = C.hilt; g.lineWidth = 5.0 * Z; g.stroke();
  g.strokeStyle = 'rgba(30,20,12,0.55)'; g.lineWidth = 1.4 * Z; g.stroke();
  // --- 폼멜
  g.beginPath(); g.arc(gx0 - ux * 2 * Z, gy0 - uy * 2 * Z, 3.0 * Z, 0, TAU);
  g.fillStyle = C.guard; g.fill();
  g.beginPath(); g.arc(gx0 - ux * 2 * Z, gy0 - uy * 2 * Z, 1.4 * Z, 0, TAU);
  g.fillStyle = '#d9c58a'; g.fill();
  // --- 날: 축 방향 단면 슬라이스를 촘촘히 쌓아 만든 판
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const cx = lerp(P0.x, P1.x, t), cy = lerp(P0.y, P1.y, t);
    const halfW = (4.6 - 3.0 * Math.pow(t, 0.7)) * Z * Math.min(1, 0.35 + t * 3);
    g.save(); g.translate(cx, cy); g.rotate(Math.atan2(uy, ux));
    const grd = g.createLinearGradient(0, -halfW, 0, halfW);
    grd.addColorStop(0, t > 0.86 ? C.bladeLo : '#f2f7fb');
    grd.addColorStop(0.42, C.blade);
    grd.addColorStop(1, t > 0.86 ? '#5d6874' : C.bladeLo);
    g.beginPath(); g.ellipse(0, 0, 2.6 * Z, Math.max(0.7, halfW), 0, 0, TAU);
    g.fillStyle = grd; g.fill();
    g.restore();
  }
  // --- 날 하이라이트 / 중심선
  g.beginPath();
  g.moveTo(P0.x + px * 3.0 * Z, P0.y + py * 3.0 * Z);
  g.lineTo(P1.x + px * 0.6 * Z, P1.y + py * 0.6 * Z);
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 1.5 * Z; g.stroke();
  g.beginPath();
  g.moveTo(P0.x - px * 1.0 * Z, P0.y - py * 1.0 * Z);
  g.lineTo(P1.x - px * 0.3 * Z, P1.y - py * 0.3 * Z);
  g.strokeStyle = 'rgba(70,80,92,0.55)'; g.lineWidth = 1.1 * Z; g.stroke();
  // --- 코등 (십자 가드)
  const cgx = P0.x + ux * 4 * Z, cgy = P0.y + uy * 4 * Z;
  g.beginPath(); g.moveTo(cgx + px * 10 * Z, cgy + py * 10 * Z); g.lineTo(cgx - px * 10 * Z, cgy - py * 10 * Z);
  g.strokeStyle = '#8b7742'; g.lineWidth = 5.0 * Z; g.stroke();
  g.strokeStyle = C.guard; g.lineWidth = 3.2 * Z; g.stroke();
  g.strokeStyle = '#e8d79f'; g.lineWidth = 1.0 * Z; g.stroke();
  // --- 칼끝 광택
  g.beginPath(); g.arc(P1.x, P1.y, 1.8 * Z, 0, TAU); g.fillStyle = '#ffffff'; g.fill();
  if (glow) {
    g.globalCompositeOperation = 'lighter';
    g.beginPath(); g.moveTo(P0.x, P0.y); g.lineTo(P1.x, P1.y);
    g.strokeStyle = 'rgba(180,220,255,' + (0.30 * glow) + ')'; g.lineWidth = 7 * Z; g.stroke();
    g.globalCompositeOperation = 'source-over';
  }
  g.restore();
}

/* 바닥 아레나 텍스처(원근 프리렌더) -------------------------------------- */
function buildFloor(worldW, worldH, tile) {
  const c = newCanvas(worldW, worldH), g = c.getContext('2d');
  g.fillStyle = '#1c1a20'; g.fillRect(0, 0, worldW, worldH);
  for (let y = 0; y < worldH; y += tile) {
    for (let x = 0; x < worldW; x += tile) {
      const ix = x / tile, iy = y / tile;
      const v = hash(ix * 7.13 + iy * 3.31);
      const v2 = hash(ix * 2.7 + iy * 9.1);
      // 타일 색 (돌)
      const base = 56 + v * 24;
      const r = base + 8, gg = base + 4, b = base + 3;
      g.fillStyle = `rgb(${r | 0},${gg | 0},${b | 0})`;
      g.fillRect(x, y, tile, tile);
      // 큰 얼룩
      // 고운 결
      g.globalAlpha = 0.13;
      g.fillStyle = v2 > 0.5 ? '#cfc9c0' : '#14111a';
      for (let k = 0; k < 3; k++) {
        const px = x + hash(ix * 3 + k) * tile, py = y + hash(iy * 5 + k) * tile;
        g.fillRect(px, py, tile * 0.18, 2);
      }
      g.globalAlpha = 1;
      // 이음선(그라우트)
      g.strokeStyle = 'rgba(12,10,16,0.62)'; g.lineWidth = 2.4;
      g.strokeRect(x + 1.5, y + 1.5, tile - 3, tile - 3);
      // 베벨 (위/왼쪽 밝게)
      g.strokeStyle = 'rgba(150,146,160,0.16)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(x + 3, y + tile - 3); g.lineTo(x + 3, y + 3); g.lineTo(x + tile - 3, y + 3); g.stroke();
      // 균열
      if (v > 0.82) {
        g.strokeStyle = 'rgba(10,8,14,0.55)'; g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(x + tile * 0.18, y + tile * 0.24);
        g.lineTo(x + tile * (0.4 + v2 * 0.2), y + tile * 0.52);
        g.lineTo(x + tile * 0.36, y + tile * 0.82);
        g.stroke();
      }
      // 자갈 / 이끼
      if (v2 < 0.10) { g.fillStyle = 'rgba(96,118,84,0.28)'; g.beginPath(); g.arc(x + tile * 0.6, y + tile * 0.6, 5, 0, TAU); g.fill(); }
      if (v2 > 0.9) { g.fillStyle = 'rgba(130,126,140,0.35)'; g.fillRect(x + tile * 0.55, y + tile * 0.2, 6, 5); }
    }
  }
  // 외곽 벽 그림자
  const band = 90;
  const sides = [
    [0, 0, worldW, band, 0, 0, 0, band],
    [0, worldH - band, worldW, band, 0, worldH, 0, worldH - band],
    [0, 0, band, worldH, 0, 0, band, 0],
    [worldW - band, 0, band, worldH, worldW, 0, worldW - band, 0]
  ];
  for (const sd of sides) {
    const lg = g.createLinearGradient(sd[4], sd[5], sd[6], sd[7]);
    lg.addColorStop(0, 'rgba(0,0,0,0.72)');
    lg.addColorStop(0.55, 'rgba(0,0,0,0.30)');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg; g.fillRect(sd[0], sd[1], sd[2], sd[3]);
  }
  return c;
}

const keys = {};
const mouse = { x: 0, y: 0, wx: 0, wz: 0, down: false, moved: 0 };

function updatePlayer(dt) {
  // --- 입력 방향
  let mx = 0, mz = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (touch.active) { mx += touch.jx; mz += touch.jz; }
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  P.moving = ml > 0.12;

  // --- 대시
  if (P.dash.t > 0) {
    P.dash.t -= dt;
    const sp = 700 * Math.max(0, P.dash.t / 0.17);
    P.x += P.dash.dx * sp * dt; P.z += P.dash.dz * sp * dt;
    P.lean = Math.min(0.55, P.lean + dt * 4);
    if (Math.random() < 0.9) {
      G.ghosts.push({ x: P.x, z: P.z, face: P.face, t: 0, life: 0.26, lean: P.lean });
    }
    spawnParts(P.x, P.z, 1, '#9b8f7a', { y: 3, sp0: 5, sp1: 40, l1: 0.4, size: 3, grav: 10 });
    if (U.dashBlast && !P.dashBlastDone && P.dash.t < 0.06) {
      P.dashBlastDone = true;
      blast(P.x, P.z, 74, 20);
    }
  } else {
    P.lean *= Math.max(0, 1 - dt * 7);
    const sp = P.speed * U.moveMul * (P.moving ? 1 : 0);
    P.vx += (mx * sp - P.vx) * Math.min(1, dt * 14);
    P.vz += (mz * sp - P.vz) * Math.min(1, dt * 14);
    P.x += P.vx * dt; P.z += P.vz * dt;
  }
  P.dash.cd = Math.max(0, P.dash.cd - dt);
  P.iframe = Math.max(0, P.iframe - dt);
  P.hurt = Math.max(0, P.hurt - dt);
  P.comboTimer = Math.max(0, P.comboTimer - dt);
  P.q.cd = Math.max(0, P.q.cd - dt);
  P.e.cd = Math.max(0, P.e.cd - dt);

  // --- 방향
  const aimWX = mouse.wx, aimWZ = mouse.wz;
  let wantFace = P.face;
  if (P.aimMouse) {
    wantFace = Math.atan2(aimWX - P.x, aimWZ - P.z);
  } else if (P.moving) {
    wantFace = Math.atan2(mx, mz);
  }
  let turning = true;
  if (P.atk.on) turning = false;
  if (turning) P.face = angLerp(P.face, wantFace, Math.min(1, dt * 16));

  // --- 걷기
  if (P.moving && P.dash.t <= 0) P.walk += dt * 11; else P.walk += dt * 2.4;

  // --- 공격 진행
  const a = P.atk;
  if (a.on) {
    a.t += dt;
    const { p, dir, pitch } = swingPose();
    if (p > 0.10 && p < 0.62) {
      const reach = a.reach;
      for (const e of G.enemies) {
        if (e.dead || a.hit.has(e)) continue;
        const dx = e.x - P.x, dz = e.z - P.z;
        const d = Math.hypot(dx, dz);
        if (d > reach + e.r) continue;
        if (Math.abs(angDiff(Math.atan2(dx, dz), dir)) > a.halfArc) continue;
        a.hit.add(e);
        const crit = Math.random() < U.crit;
        hurtEnemy(e, a.dmg * (crit ? U.critMul : 1) * rnd(0.92, 1.08), a.kb, Math.atan2(dx, dz), crit);
      }
    }
    // 검 궤적
    const hp2 = swordPose(dir, pitch);
    if (p > 0.06 && p < 0.72) {
      P.trail.push({ x1: hp2.mx, y1: hp2.my, z1: hp2.mz, x2: hp2.tx, y2: hp2.ty, z2: hp2.tz, t: 0 });
    }
    if (a.t >= a.dur) { a.on = false; a.t = 0; }
  }
  // --- 회전 베기
  if (P.q.t > 0) {
    P.q.t -= dt; P.q.spin += dt * 26;
    continueSteer(dt);
    P.q.tick -= dt;
    if (P.q.tick <= 0) {
      P.q.tick = 0.13;
      const rad = 92 * U.whirlMul;
      for (const e of G.enemies) {
        if (e.dead) continue;
        const dx = e.x - P.x, dz = e.z - P.z;
        if (Math.hypot(dx, dz) < rad + e.r) {
          hurtEnemy(e, 9 * U.whirlMul, 150, Math.atan2(dx, dz), false);
        }
      }
      spawnParts(P.x, P.z, 6, '#ffe9b0', { y: 50, sp0: 130, sp1: 300, l1: 0.3, size: 3, grav: 0 });
    }
    if (P.q.t <= 0) P.q.cd = 6.2;
  }
  // 클램프
  P.x = clamp(P.x, -ARENA + 40, ARENA - 40);
  P.z = clamp(P.z, -ARENA + 40, ARENA - 40);
  collideProps(P);
  resolveEnemyOverlap();

  // 트레일 수명
  for (let i = P.trail.length - 1; i >= 0; i--) { P.trail[i].t += dt; if (P.trail[i].t > 0.20) P.trail.splice(i, 1); }
}
function continueSteer(dt) {
  if (P.q.t > 0) {
    const sp = 130;
    let mx = 0, mz = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
    if (touch.active) { mx += touch.jx; mz += touch.jz; }
    const l = Math.hypot(mx, mz) || 1;
    P.x += (mx / l) * sp * dt; P.z += (mz / l) * sp * dt;
  }
}
function resolveEnemyOverlap() {
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = P.x - e.x, dz = P.z - e.z;
    const d = Math.hypot(dx, dz), min = P.r + e.r * 0.85;
    if (d > 0.001 && d < min) {
      const push = (min - d) * 0.5;
      P.x += (dx / d) * push; P.z += (dz / d) * push;
      e.x -= (dx / d) * push * 0.4; e.z -= (dz / d) * push * 0.4;
    }
  }
}
function collideProps(o) {
  for (const p of G.props) {
    if (p.dead || p.type === 'brazier') continue;
    const dx = o.x - p.x, dz = o.z - p.z;
    const d = Math.hypot(dx, dz), min = (o.r || 14) + p.r * 0.8;
    if (d > 0.001 && d < min) { o.x = p.x + (dx / d) * min; o.z = p.z + (dz / d) * min; }
  }
}

/* 검 끝/중간 위치 (월드) */
function swordPose(dir, pitch) {
  const hx = P.x - 16 * Math.cos(P.face) + 5 * Math.sin(P.face);
  const hz = P.z + 16 * Math.sin(P.face) + 5 * Math.cos(P.face);
  const hy = 74;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const nx = Math.sin(dir) * cp, ny = sp, nz = Math.cos(dir) * cp;
  const len = 62;
  return { hx, hy, hz, dir, pitch, len, mx: hx + nx * len * 0.45, my: hy + ny * len * 0.45, mz: hz + nz * len * 0.45, tx: hx + nx * len, ty: hy + ny * len, tz: hz + nz * len };
}

/* ---------------- 대시 / 스킬 ---------------- */
function doDash() {
  if (P.dash.cd > 0 || P.dash.t > 0 || G.state !== 'play') return;
  let dx, dz;
  let mx = 0, mz = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (touch.active) { mx += touch.jx; mz += touch.jz; }
  if (Math.hypot(mx, mz) > 0.2) { const l = Math.hypot(mx, mz); dx = mx / l; dz = mz / l; }
  else { dx = Math.sin(P.face); dz = Math.cos(P.face); }
  P.dash.dx = dx; P.dash.dz = dz; P.dash.t = 0.17; P.dash.cd = U.dashCd;
  P.iframe = 0.34; P.dashBlastDone = false;
  P.vx = 0; P.vz = 0;
  spawnParts(P.x, P.z, 10, '#cfc3ac', { y: 4, sp0: 30, sp1: 150, l1: 0.45, size: 3.6, grav: 140 });
  G.shake = Math.max(G.shake, 2.5);
}
function doWhirl() {
  if (P.q.cd > 0 || P.q.t > 0 || G.state !== 'play') return;
  P.q.t = 0.52; P.q.tick = 0; P.q.spin = 0;
  G.shake = Math.max(G.shake, 5);
  G.slashes.push({ x: P.x, z: P.z, y: 58, r: 92 * U.whirlMul, a0: 0, a1: TAU, t: 0, life: 0.38, thick: 15, ring: true });
}
function doWave() {
  if (P.e.cd > 0 || G.state !== 'play') return;
  P.e.cd = 4.2;
  const n = U.waveCount;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 0.22;
    const dir = P.face + off;
    G.shots.push({
      type: 'wave', x: P.x + Math.sin(dir) * 26, z: P.z + Math.cos(dir) * 26,
      vx: Math.sin(dir) * 470, vz: Math.cos(dir) * 470, r: 42, dmg: 20 * (1 + (U.reachMul - 1) * 0.4),
      life: 1.0, t: 0, dir, hit: new Set(), pierce: true
    });
  }
  // 돌진
  P.vx += Math.sin(P.face) * 260; P.vz += Math.cos(P.face) * 260;
  P.iframe = Math.max(P.iframe, 0.16);
  spawnParts(P.x, P.z, 12, '#bfe6ff', { y: 55, sp0: 80, sp1: 260, l1: 0.4, size: 3, grav: 0 });
  G.shake = Math.max(G.shake, 3);
}
function blast(x, z, r, dmg) {
  G.shots.push({ type: 'blast', x, z, r, dmg, life: 0.28, t: 0, hit: new Set(), vx: 0, vz: 0 });
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dz = e.z - z;
    if (Math.hypot(dx, dz) < r + e.r) hurtEnemy(e, dmg, 260, Math.atan2(dx, dz), false);
  }
  spawnParts(x, z, 16, '#ffd08a', { y: 8, sp0: 120, sp1: 320, l1: 0.45, size: 4, grav: 90 });
  G.shake = Math.max(G.shake, 5);
}

/* ---------------- 피해 ---------------- */
function hurtPlayer(dmg, sx, sz) {
  if (P.iframe > 0 || G.state !== 'play') return;
  P.hp -= dmg;
  P.iframe = 0.9; P.hurt = 0.4;
  G.flash = 0.45; G.shake = Math.max(G.shake, 8);
  if (sx !== undefined) {
    const a = Math.atan2(P.x - sx, P.z - sz);
    P.vx += Math.sin(a) * 200; P.vz += Math.cos(a) * 200;
  }
  spawnParts(P.x, P.z, 10, '#a62820', { y: 60, sp0: 40, sp1: 170, l1: 0.5, size: 3.6 });
  spawnText(P.x, P.z, 130, '-' + Math.round(dmg), '#ff6b5e', false);
  updateHUD();
  if (P.hp <= 0) { P.hp = 0; gameOver(); }
}

/* ---------------- 업데이트 ---------------- */
function update(dt) {
  if (G.state === 'over' || G.state === 'win') { G.overT += dt; return; }
  if (G.state === 'cards') return;
  G.t += dt;
  updatePlayer(dt);

  // 스폰 큐
  if (G.spawnQ.length) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      G.spawnT = 0.34;
      const t = G.spawnQ.shift();
      const a = Math.random() * TAU, d = rnd(230, 400);
      spawnEnemy(t, clamp(P.x + Math.sin(a) * d, -ARENA + 60, ARENA - 60), clamp(P.z + Math.cos(a) * d, -ARENA + 60, ARENA - 60));
    }
  }

  // 적
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.t += dt; e.hurt = Math.max(0, e.hurt - dt); e.atkCd = Math.max(0, e.atkCd - dt);
    const dx = P.x - e.x, dz = P.z - e.z;
    const d = Math.hypot(dx, dz) || 1;
    const ux = dx / d, uz = dz / d;
    if (e.type === 'slime') {
      e.face = angLerp(e.face, Math.atan2(dx, dz), dt * 6);
      if (e.state === 'chase') {
        e.vx += (ux * e.speed - e.vx) * dt * 4;
        e.vz += (uz * e.speed - e.vz) * dt * 4;
        if (d < 150 && e.atkCd <= 0) { e.state = 'wind'; e.st = 0.34; }
      } else if (e.state === 'wind') {
        e.st -= dt; e.vx *= 0.86; e.vz *= 0.86;
        if (e.st <= 0) { e.state = 'hop'; e.st = 0.5; e.vx = ux * 330; e.vz = uz * 330; }
      } else if (e.state === 'hop') {
        e.st -= dt;
        if (e.st <= 0) { e.state = 'chase'; e.atkCd = 0.75; }
      }
      e.x += e.vx * dt; e.z += e.vz * dt;
      e.vx *= Math.max(0, 1 - dt * 2.2); e.vz *= Math.max(0, 1 - dt * 2.2);
      if (d < e.r + P.r + 2) { hurtPlayer(e.dmg, e.x, e.z); e.vx = -ux * 180; e.vz = -uz * 180; }
    } else if (e.type === 'goblin') {
      e.face = angLerp(e.face, Math.atan2(dx, dz), dt * 7);
      if (e.state === 'chase') {
        e.vx += (ux * e.speed - e.vx) * dt * 5;
        e.vz += (uz * e.speed - e.vz) * dt * 5;
        if (d < 150 && e.atkCd <= 0) { e.state = 'wind'; e.st = 0.42; }
      } else if (e.state === 'wind') {
        e.st -= dt; e.vx *= 0.8; e.vz *= 0.8;
        e.face = angLerp(e.face, Math.atan2(dx, dz), dt * 9);
        if (e.st <= 0) { e.state = 'lunge'; e.st = 0.30; e.vx = ux * 520; e.vz = uz * 520; }
      } else if (e.state === 'lunge') {
        e.st -= dt;
        if (e.st <= 0) { e.state = 'chase'; e.atkCd = 1.15; }
      }
      e.x += e.vx * dt; e.z += e.vz * dt;
      e.vx *= Math.max(0, 1 - dt * 3.0); e.vz *= Math.max(0, 1 - dt * 3.0);
      if (d < e.r + P.r + 2) hurtPlayer(e.dmg, e.x, e.z);
    } else {
      // mage
      e.face = angLerp(e.face, Math.atan2(dx, dz), dt * 5);
      const want = d < 220 ? -1 : (d > 330 ? 1 : 0);
      e.vx += (ux * e.speed * want - e.vx) * dt * 3;
      e.vz += (uz * e.speed * want - e.vz) * dt * 3;
      e.x += e.vx * dt; e.z += e.vz * dt;
      e.vx *= Math.max(0, 1 - dt * 2.2); e.vz *= Math.max(0, 1 - dt * 2.2);
      if (e.state === 'chase' && e.atkCd <= 0 && d < 460) { e.state = 'cast'; e.st = 0.62; }
      if (e.state === 'cast') {
        e.st -= dt;
        if (Math.random() < 0.3) spawnParts(e.x, e.z, 1, '#9fd4ff', { y: 70, sp0: 5, sp1: 30, l1: 0.4, size: 2.6, grav: -30 });
        if (e.st <= 0) {
          e.state = 'chase'; e.atkCd = 2.3;
          const ang = Math.atan2(dx, dz);
          G.shots.push({ type: 'orb', x: e.x + Math.sin(ang) * 20, z: e.z + Math.cos(ang) * 20, vx: Math.sin(ang) * 205, vz: Math.cos(ang) * 205, r: 13, dmg: 11, life: 3.2, t: 0, dir: ang });
        }
      }
    }
    // 상태 표시용
    e.x = clamp(e.x, -ARENA + 40, ARENA - 40); e.z = clamp(e.z, -ARENA + 40, ARENA - 40);
    collideProps(e);
  }
  // 적끼리 겹침
  for (let i = 0; i < G.enemies.length; i++) {
    const a = G.enemies[i]; if (a.dead) continue;
    for (let j = i + 1; j < G.enemies.length; j++) {
      const b = G.enemies[j]; if (b.dead) continue;
      const dx = b.x - a.x, dz = b.z - a.z; const d = Math.hypot(dx, dz), min = (a.r + b.r) * 0.85;
      if (d > 0.001 && d < min) { const p = (min - d) * 0.5; a.x -= (dx / d) * p; a.z -= (dz / d) * p; b.x += (dx / d) * p; b.z += (dz / d) * p; }
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);

  // 투사체
  for (const s of G.shots) {
    s.t += dt;
    s.x += (s.vx || 0) * dt; s.z += (s.vz || 0) * dt;
    if (s.type === 'orb') {
      if (Math.random() < 0.5) spawnParts(s.x, s.z, 1, '#8fa9ff', { y: 46, sp0: 2, sp1: 22, l1: 0.35, size: 2.6, grav: -10 });
      if (dist2(s.x, s.z, P.x, P.z) < (s.r + P.r) * (s.r + P.r)) { hurtPlayer(s.dmg, s.x, s.z); s.life = 0; }
    } else if (s.type === 'wave') {
      for (const e of G.enemies) {
        if (e.dead || s.hit.has(e)) continue;
        if (dist2(s.x, s.z, e.x, e.z) < (s.r + e.r) * (s.r + e.r)) {
          s.hit.add(e);
          hurtEnemy(e, s.dmg, 240, Math.atan2(e.x - P.x, e.z - P.z), false);
        }
      }
    }
    if (Math.abs(s.x) > ARENA || Math.abs(s.z) > ARENA) s.life = 0;
  }
  G.shots = G.shots.filter(s => s.life > 0 && s.t < s.life);

  // 영혼 구슬
  for (const o of G.orbs) {
    o.t += dt;
    if (o.t > 0.3) {
      const dx = P.x - o.x, dz = P.z - o.z, d = Math.hypot(dx, dz) || 1;
      const sp = 260 + o.t * 260;
      o.vx += (dx / d) * sp * dt * 6; o.vz += (dz / d) * sp * dt * 6;
      o.vx *= Math.max(0, 1 - dt * 2.4); o.vz *= Math.max(0, 1 - dt * 2.4);
    } else { o.vx *= 0.94; o.vz *= 0.94; }
    o.x += o.vx * dt; o.z += o.vz * dt;
    if (dist2(o.x, o.z, P.x, P.z) < 26 * 26) { o.gone = true; gainXP(o.val); spawnParts(o.x, o.z, 3, '#bfe6ff', { y: 40, sp0: 10, sp1: 60, l1: 0.3, size: 2.4, grav: 0 }); }
  }
  G.orbs = G.orbs.filter(o => !o.gone);

  // 파티클 / 텍스트 / 잔상
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt; p.vy -= p.grav * dt; if (p.y < 0) { p.y = 0; p.vy *= -0.35; } }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const t of G.texts) t.t += dt;
  G.texts = G.texts.filter(t => t.t < t.life);
  for (const gh of G.ghosts) gh.t += dt;
  G.ghosts = G.ghosts.filter(g => g.t < g.life);
  for (const d of G.decals) d.t += dt;
  for (const sl of G.slashes) sl.t += dt;
  G.slashes = G.slashes.filter(s2 => s2.t < s2.life);

  // 웨이브 진행
  if (G.state === 'play' && !G.spawnQ.length && !G.enemies.length) {
    if (G.clearT <= 0) { G.clearT = 1.3; P.hp = Math.min(P.maxHp, P.hp + 10); banner('WAVE CLEAR', '강화 카드를 고르세요'); }
    else {
      G.clearT -= dt;
      if (G.clearT <= 0) {
        G.clearT = 0;
        if (G.wave >= G.waveTotal) { offerCards('win'); }
        else { offerCards('nextwave'); }
      }
    }
  }
  if (G.enemies.length > 0) G.clearT = 0;

  G.hitStop = Math.max(0, G.hitStop - dt);
  G.shake *= Math.max(0, 1 - dt * 6);
  G.flash = Math.max(0, G.flash - dt * 1.6);

  // 카메라
  const lead = 0.22;
  CAM.x = lerp(CAM.x, P.x + P.vx * lead, Math.min(1, dt * 6));
  CAM.z = lerp(CAM.z, P.z + P.vz * lead, Math.min(1, dt * 6));
  const zt = P.zoomT || 1.45;
  CAM.zoom = lerp(CAM.zoom, zt, Math.min(1, dt * 5));
}

/* ---------------- 렌더 ---------------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vw = VW, vh = VH;
  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, vh);
  bg.addColorStop(0, '#0a0a0e'); bg.addColorStop(1, '#141319');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, vw, vh);

  // 바닥
  ctx.save();
  ctx.drawImage(ST.floor, scrX(-ARENA), scrY(0, -ARENA), ARENA * 2 * CAM.zoom, ARENA * 2 * CAM.yScale * CAM.zoom);
  ctx.restore();

  // 바닥 얼룩
  for (const d of G.decals) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.55, 0.55 - d.t * 0.006);
    ctx.translate(scrX(d.x), scrY(0, d.z)); ctx.scale(1, CAM.yScale);
    ctx.beginPath(); ctx.arc(0, 0, d.r * CAM.zoom, 0, TAU);
    ctx.fillStyle = d.col; ctx.fill();
    ctx.restore();
  }

  // 화로 빛 (바닥)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.props) {
    if (p.type !== 'brazier' || p.dead) continue;
    const gx = scrX(p.x), gy = scrY(0, p.z);
    const fl = 0.82 + Math.sin(G.t * 9 + p.x) * 0.12;
    const rad = 150 * CAM.zoom * fl;
    const grd = ctx.createRadialGradient(gx, gy - 20 * CAM.zoom, 4, gx, gy - 20 * CAM.zoom, rad);
    grd.addColorStop(0, 'rgba(255,150,60,0.30)');
    grd.addColorStop(0.5, 'rgba(255,110,40,0.10)');
    grd.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.save(); ctx.translate(gx, gy - 20 * CAM.zoom); ctx.scale(1, CAM.yScale);
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.fillStyle = grd; ctx.fill(); ctx.restore();
  }
  ctx.restore();

  /* --- Y 정렬 드로어블 --- */
  const draws = [];
  for (const p of G.props) if (!p.dead) draws.push({ z: p.z, k: 'prop', o: p });
  for (const e of G.enemies) draws.push({ z: e.z, k: 'enemy', o: e });
  for (const s of G.shots) if (s.type !== 'blast') draws.push({ z: s.z, k: 'shot', o: s });
  for (const o of G.orbs) draws.push({ z: o.z, k: 'orb', o });
  draws.push({ z: P.z, k: 'player', o: P });
  draws.sort((a, b) => a.z - b.z);

  for (const d of draws) {
    if (d.k === 'prop') drawProp(d.o);
    else if (d.k === 'enemy') drawEnemy(d.o);
    else if (d.k === 'shot') drawShot(d.o);
    else if (d.k === 'orb') drawOrb(d.o);
    else drawPlayerDrawable();
  }

  // 바닥 폭발 링
  for (const s of G.shots) if (s.type === 'blast') drawBlast(s);

  // 잔상
  for (const gh of G.ghosts) {
    const a = 1 - gh.t / gh.life;
    drawStack(ctx, ST.hero, gh.x, gh.z, gh.face, { alpha: a * 0.30, lean: gh.lean, yScale: CAM.yScale });
  }

  drawSlashes();

  // 파티클
  for (const p of G.parts) {
    const a = 1 - p.t / p.life;
    const sx = scrX(p.x), sy = scrY(p.y, p.z);
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.col;
    const s = p.size * (0.6 + a * 0.7);
    ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  // 데미지 텍스트
  ctx.textAlign = 'center';
  for (const t of G.texts) {
    const a = 1 - t.t / t.life;
    const sy = scrY(t.y + t.t * 46, t.z);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.font = '900 ' + (t.big ? 25 : 18) + 'px "Apple SD Gothic Neo",monospace';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000000cc';
    ctx.strokeText(t.str, scrX(t.x), sy);
    ctx.fillStyle = t.col; ctx.fillText(t.str, scrX(t.x), sy);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  // 피격 비네트
  if (G.flash > 0) {
    const g2 = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.25, vw / 2, vh / 2, vh * 0.78);
    g2.addColorStop(0, 'rgba(160,20,16,0)');
    g2.addColorStop(1, 'rgba(190,26,20,' + (0.55 * G.flash) + ')');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, vw, vh);
  }
  // 어둠 비네트
  const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.36, vw / 2, vh / 2, Math.max(vw, vh) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
}

function drawPlayerDrawable() {
  const bob = P.moving && P.dash.t <= 0 ? Math.sin(P.walk) * 2.6 : Math.sin(G.t * 2.2) * 1.1;
  const angle = P.face + (P.q.t > 0 ? P.q.spin : 0);
  drawShadow(ctx, P.x, P.z, 17, 0.55);
  // 검 (뒤쪽 반투명 → 앞)
  let pose;
  if (P.q.t > 0) {
    const dir = P.face + P.q.spin * 1.0;
    pose = swordPose(dir, 0.12);
  } else if (P.atk.on) {
    const sw = swingPose();
    pose = swordPose(sw.dir, sw.pitch);
  } else {
    pose = swordPose(P.face - 1.15, -0.28 + Math.sin(G.t * 2) * 0.03);
  }
  const behind = pose.mz < P.z - 1;
  const glow = P.atk.on || P.q.t > 0 ? 0.9 : 0.25;
  if (behind) drawSword(ctx, pose.hx, pose.hy + bob, pose.hz, pose.dir, pose.pitch, pose.len, glow, 1);
  // 상체 비틀기: 검을 휘두르는 방향으로 몸통이 따라 돈다
  let twist = 0;
  if (P.atk.on) {
    const sw = swingPose();
    twist = clamp(angDiff(sw.dir, P.face) * 0.30, -0.5, 0.5);
  } else if (P.moving) {
    twist = Math.sin(P.walk) * 0.045;
  }
  drawStack(ctx, ST.hero, P.x, P.z, angle, {
    yOff: bob, lean: P.lean, twist: twist,
    alpha: P.iframe > 0 && P.dash.t <= 0 && Math.floor(G.t * 22) % 2 ? 0.45 : 1
  });
  if (!behind) drawSword(ctx, pose.hx, pose.hy + bob, pose.hz, pose.dir, pose.pitch, pose.len, glow, 1);
  drawFace(ctx, P.x, P.z, angle, HERO.faceY);
  // 검 궤적
  drawTrail();
}
function drawTrail() {
  if (P.trail.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i < P.trail.length; i++) {
    const a = P.trail[i - 1], b = P.trail[i];
    const age = Math.min(1, (a.t + b.t) * 0.5 / 0.20);
    const al = (1 - age) * 0.55;
    if (al <= 0.01) continue;
    ctx.beginPath();
    ctx.moveTo(scrX(a.x1), scrY(a.y1, a.z1));
    ctx.lineTo(scrX(a.x2), scrY(a.y2, a.z2));
    ctx.lineTo(scrX(b.x2), scrY(b.y2, b.z2));
    ctx.lineTo(scrX(b.x1), scrY(b.y1, b.z1));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,246,214,' + al + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,215,255,' + al * 0.85 + ')';
    ctx.lineWidth = 2.2; ctx.stroke();
  }
  ctx.restore();
}
function drawProp(p) {
  drawShadow(ctx, p.x, p.z, p.type === 'pillar' ? 20 : 15, 0.5);
  if (p.type === 'pillar') drawStack(ctx, ST.pillar, p.x, p.z, 0, {});
  else if (p.type === 'crate') drawStack(ctx, ST.crate, p.x, p.z, 0, {});
  else if (p.type === 'brazier') {
    drawStack(ctx, ST.brazier, p.x, p.z, 0, {});
    // 불꽃
    const bx = scrX(p.x), by = scrY(33, p.z);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const ph = G.t * 6 + i * 1.7;
      const fx = Math.sin(ph * 1.7 + i) * 4 * CAM.zoom;
      const fh = (14 + Math.sin(ph) * 7) * CAM.zoom;
      const grd = ctx.createRadialGradient(bx + fx, by - fh * 0.3, 1, bx + fx, by - fh * 0.3, fh);
      grd.addColorStop(0, 'rgba(255,240,190,0.9)');
      grd.addColorStop(0.45, 'rgba(255,150,50,0.55)');
      grd.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.beginPath(); ctx.ellipse(bx + fx, by - fh * 0.35, fh * 0.5, fh * 0.75, 0, 0, TAU);
      ctx.fillStyle = grd; ctx.fill();
    }
    ctx.restore();
  }
}
function drawEnemy(e) {
  const st = ST[e.stack];
  const bounce = e.type === 'slime' ? (e.state === 'hop' ? Math.abs(Math.sin(e.t * 14)) * 12 : Math.abs(Math.sin(e.t * 3)) * 2) : Math.abs(Math.sin(e.t * 8)) * (e.state === 'lunge' ? 5 : 2);
  const squash = e.type === 'slime' ? (e.state === 'wind' ? 0.82 : 1 + Math.sin(e.t * 14) * 0.06) : 1;
  drawShadow(ctx, e.x, e.z, e.r * 1.05, 0.5);
  // 예고 표시
  if (e.state === 'wind' || e.state === 'cast') {
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(G.t * 20) * 0.2;
    ctx.strokeStyle = e.state === 'cast' ? '#8fd4ff' : '#ff5a4a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(scrX(e.x), scrY(0, e.z), e.r * 1.5 * CAM.zoom, e.r * 1.5 * CAM.zoom * CAM.yScale, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  drawStack(ctx, st, e.x, e.z, e.face, {
    yOff: -bounce, scaleY: squash, scaleX: e.type === 'slime' ? 1 + (1 - squash) * 0.6 : 1,
    tint: e.hurt > 0 ? 'brightness(1.45)' : undefined
  });
  // HP 바
  if (e.hp < e.maxHp) {
    const w = 34, hpp = Math.max(0, e.hp / e.maxHp);
    const bx = scrX(e.x) - w / 2, by = scrY(e.h + 10, e.z);
    ctx.fillStyle = '#000000aa'; ctx.fillRect(bx - 1, by - 1, w + 2, 6);
    ctx.fillStyle = '#8a2420'; ctx.fillRect(bx, by, w, 4);
    ctx.fillStyle = '#e0554a'; ctx.fillRect(bx, by, w * hpp, 4);
  }
}
function drawShot(s) {
  if (s.type === 'orb') {
    const sx = scrX(s.x), sy = scrY(46, s.z);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const grd = ctx.createRadialGradient(sx, sy, 1, sx, sy, 22 * CAM.zoom);
    grd.addColorStop(0, 'rgba(230,245,255,0.95)');
    grd.addColorStop(0.35, 'rgba(120,170,255,0.6)');
    grd.addColorStop(1, 'rgba(90,120,255,0)');
    ctx.beginPath(); ctx.arc(sx, sy, 22 * CAM.zoom, 0, TAU); ctx.fillStyle = grd; ctx.fill();
    ctx.fillStyle = '#dceaff'; ctx.beginPath(); ctx.arc(sx, sy, 4.2 * CAM.zoom, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (s.type === 'wave') {
    drawCrescent(s);
  }
}
function drawCrescent(s) {
  const sx = scrX(s.x), sy = scrY(46, s.z);
  const a = s.t / s.life;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(0);
  ctx.globalCompositeOperation = 'lighter';
  const R = s.r * CAM.zoom;
  // 초승달: 회전된 호
  const dirScreen = Math.atan2(Math.cos(s.dir) * CAM.yScale, Math.sin(s.dir));
  ctx.rotate(dirScreen + Math.PI / 2);
  ctx.beginPath();
  ctx.arc(0, 0, R, -0.95, 0.95);
  ctx.strokeStyle = 'rgba(190,235,255,' + (0.95 - a * 0.3) + ')';
  ctx.lineWidth = 7 * CAM.zoom * (1 - a * 0.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, R, -0.8, 0.8);
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 - a * 0.4) + ')';
  ctx.lineWidth = 2.4 * CAM.zoom;
  ctx.stroke();
  ctx.restore();
  // 뒤로 흐르는 잔상
  ctx.save(); ctx.globalAlpha = 0.25;
  for (let i = 1; i <= 3; i++) {
    const px = s.x - Math.sin(s.dir) * i * 14, pz = s.z - Math.cos(s.dir) * i * 14;
    ctx.beginPath();
    ctx.ellipse(scrX(px), scrY(46, pz), 12 * CAM.zoom, 10 * CAM.zoom, 0, 0, TAU);
    ctx.fillStyle = 'rgba(150,210,255,0.25)'; ctx.fill();
  }
  ctx.restore();
}
function drawBlast(s) {
  const a = s.t / s.life;
  const sx = scrX(s.x), sy = scrY(0, s.z);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(sx, sy); ctx.scale(1, CAM.yScale);
  ctx.beginPath(); ctx.arc(0, 0, s.r * CAM.zoom * (0.5 + a * 0.9), 0, TAU);
  ctx.strokeStyle = 'rgba(255,210,140,' + (0.8 * (1 - a)) + ')';
  ctx.lineWidth = 10 * CAM.zoom * (1 - a);
  ctx.stroke();
  ctx.restore();
}
function drawOrb(o) {
  const sx = scrX(o.x), sy = scrY(18 + Math.sin(o.t * 6) * 3, o.z);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const grd = ctx.createRadialGradient(sx, sy, 1, sx, sy, 16 * CAM.zoom);
  grd.addColorStop(0, 'rgba(230,250,255,0.95)');
  grd.addColorStop(0.4, 'rgba(120,220,255,0.6)');
  grd.addColorStop(1, 'rgba(80,160,255,0)');
  ctx.beginPath(); ctx.arc(sx, sy, 16 * CAM.zoom, 0, TAU); ctx.fillStyle = grd; ctx.fill();
  ctx.restore();
}

function drawSlashes() {
  for (const s of G.slashes) {
    const a = s.t / s.life;
    if (a >= 1) continue;
    const base = Math.pow(1 - a, 1.2);
    const Z = CAM.zoom;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const segs = s.ring ? 40 : 22;
    const layers = s.ring ? 2 : 3;
    for (let layer = 0; layer < layers; layer++) {
      const yy = s.y + layer * 8;
      const al0 = base * (0.9 - layer * 0.26);
      for (let i = 0; i < segs; i++) {
        const u0 = i / segs, u1 = (i + 1) / segs;
        // 궤적 꼬리 → 머리로 갈수록 밝게
        let w;
        if (s.ring) {
          const headA = s.a1 * Math.min(1, a * 2.4);
          const ang = lerp(s.a0, s.a1, (u0 + u1) * 0.5);
          let d = ((headA - ang) % TAU + TAU) % TAU;   // 머리에서 뒤로 갈수록 어둡게
          w = 0.12 + 0.88 * Math.pow(1 - d / TAU, 2.2);
        } else {
          w = Math.pow((u0 + u1) * 0.5, 1.5);
        }
        const al = al0 * w;
        if (al < 0.015) continue;
        let ang0, ang1, y0, y1, r0, r1;
        if (s.vert) {
          const e0 = 1 - Math.pow(1 - u0, 1.6), e1 = 1 - Math.pow(1 - u1, 1.6);
          ang0 = lerp(s.a0, s.a1, e0); ang1 = lerp(s.a0, s.a1, e1);
          y0 = yy - e0 * 58; y1 = yy - e1 * 58;
          r0 = s.r * (0.7 + e0 * 0.42); r1 = s.r * (0.7 + e1 * 0.42);
        } else {
          ang0 = lerp(s.a0, s.a1, u0); ang1 = lerp(s.a0, s.a1, u1);
          y0 = y1 = yy;
          r0 = r1 = s.r * (s.ring ? (0.9 + a * 0.3) : 1);
        }
        const x0 = scrX(s.x + Math.sin(ang0) * r0), zz0 = scrY(y0, s.z + Math.cos(ang0) * r0);
        const x1 = scrX(s.x + Math.sin(ang1) * r1), zz1 = scrY(y1, s.z + Math.cos(ang1) * r1);
        ctx.beginPath(); ctx.moveTo(x0, zz0); ctx.lineTo(x1, zz1);
        ctx.strokeStyle = 'rgba(255,250,226,' + al + ')';
        ctx.lineWidth = s.thick * Z * (1 - a * 0.35) * (0.85 - layer * 0.22) * (s.ring ? 1 : (0.55 + w * 0.75));
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0, zz0); ctx.lineTo(x1, zz1);
        ctx.strokeStyle = 'rgba(150,215,255,' + (al * 0.9) + ')';
        ctx.lineWidth = s.thick * 0.3 * Z * (1 - a * 0.35);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (e.code === 'KeyJ') startAttack();
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') doDash();
  if (e.code === 'KeyQ') doWhirl();
  if (e.code === 'KeyE') doWave();
  if (e.code === 'KeyV') { P.zoomT = (P.zoomT || BASE_ZOOM()) > 2 ? BASE_ZOOM() : 2.45; }
  if (e.code === 'KeyI') { $('inspector').classList.toggle('off'); }
  if (e.code === 'KeyM') { $('touchui').classList.toggle('off'); }
  if (e.code === 'KeyR') location.reload();
  if (G.state === 'cards') {
    if (e.code === 'Digit1') pickCard(0);
    if (e.code === 'Digit2') pickCard(1);
    if (e.code === 'Digit3') pickCard(2);
  }
});

const joy = $('joyBase'), knob = $('joyKnob');
function enableTouch() {
  touch.on = true;
  document.body.classList.add('touchmode');
  $('touchui').classList.remove('off');
  // 터치에서는 마우스 조준 대신 이동 방향으로 바라봄
  P.aimMouse = false;
}
joy.addEventListener('pointerdown', e => { touch.active = true; touch.id = e.pointerId; joy.setPointerCapture(e.pointerId); touch.cx = e.clientX; touch.cy = e.clientY; });
joy.addEventListener('pointermove', e => {
  if (!touch.active || e.pointerId !== touch.id) return;
  let dx = e.clientX - touch.cx, dy = e.clientY - touch.cy;
  const l = Math.hypot(dx, dy), max = 48;
  if (l > max) { dx = dx / l * max; dy = dy / l * max; }
  touch.jx = dx / max; touch.jz = dy / max;
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
});
const endJoy = e => { touch.active = false; touch.jx = 0; touch.jz = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointercancel', endJoy);
$('tAttack').addEventListener('pointerdown', e => { e.preventDefault(); startAttack(); });

function resetGame() {

  P.atk.on = false; P.atk.t = 0; P.comboIdx = 0; P.comboTimer = 0; P.trail.length = 0;
  P.dash.t = 0; P.dash.cd = 0; P.q.t = 0; P.q.cd = 0; P.e.cd = 0;
  P.xp = 0; P.level = 1; P.xpNext = 12; P.zoomT = BASE_ZOOM();
  G.enemies.length = 0; G.orbs.length = 0; G.shots.length = 0; G.parts.length = 0; G.texts.length = 0;
  G.ghosts.length = 0; G.decals.length = 0; G.kills = 0; G.pickedCards = {}; G.state = 'play';
  G.clearT = 0; G.hitStop = 0; G.flash = 0; G.overT = 0;
  CAM.x = P.x; CAM.z = P.z; CAM.zoom = P.zoomT;
  setupArena();
  startWave(1);
  updateHUD();
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  const frozen = G.hitStop > 0;
  if (!frozen) update(dt);
  else G.hitStop -= dt;

  if (cv.clientWidth && (Math.abs(cv.clientWidth - VW) > 0.5 || Math.abs(cv.clientHeight - VH) > 0.5)) resize();

  // 카메라 흔들림
  CAM.shakeX = (Math.random() - 0.5) * G.shake * 2;
  CAM.shakeY = (Math.random() - 0.5) * G.shake * 2;

  render();
  if (!IS_TOUCH) drawInspector2();
  hudT += dt;
  if (hudT > 0.08) { hudT = 0; updateHUD(); updateSkillUI(); }
  requestAnimationFrame(loop);
}

function boot() {
  resize();
  initAssets();
  if (IS_TOUCH) enableTouch();
  resetGame();
  window.__game = { P, U, G, CAM, startAttack, doDash, doWhirl, doWave, spawnEnemy, startWave, offerCards, pickCard, get state() { return G.state; } };
  window.__dbg = () => ({ VW: VW, VH: VH, cw: cv.width, ch: cv.height, clw: cv.clientWidth, clh: cv.clientHeight, z: CAM.zoom, dpr: DPR, iw: window.innerWidth, ih: window.innerHeight, state: G.state });
  requestAnimationFrame(loop);
}
window.addEventListener('load', boot);

</script>
</body>
</html>
